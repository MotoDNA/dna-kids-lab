<!doctype html><html><head><meta charset=utf8><meta name=viewport content="width=device-width,initial-scale=1"><style>:root{color-scheme:light}body{margin:0;padding:0;font:14px -apple-system,BlinkMacSystemFont,sans-serif;background:#faf9f5;color:#141413}img{max-width:100%}[hidden]:not([hidden=until-found i]){display:none!important}</style></head><body>
<title>타닥타닥</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Jua&family=Noto+Sans+KR:wght@400;500;700&display=swap">
<style>
:root{
  --bg:#F3F5FA; --surface:#FFFFFF; --surface-2:#F7F8FC; --surface-3:#EDF0F7; --ink:#1B2340; --ink-soft:#6E7791; --hair:rgba(27,35,64,.10);
  --accent:#FF8A3D; --accent-ink:#3A1E05; --accent-glow:rgba(255,138,61,.45);
  --primary:#4F6BFF; --primary-ink:#FFFFFF; --primary-soft:#E9EDFF;
  --mint:#1FB77E; --mint-soft:#DDF6EC; --rose:#EF5B6B; --rose-soft:#FDE3E6; --grape:#8A6BFF;
  --key:#FFFFFF; --key-ink:#1B2340; --key-sub:#9AA3BC; --key-shadow:rgba(27,35,64,.14);
  --f-pinky:#F6A5BE; --f-ring:#F7C279; --f-mid:#F3DD6B; --f-index:#98DDA6; --f-thumb:#9CC6F5;
  --shadow-soft:0 8px 24px rgba(27,35,64,.08);
  --display:'Jua','Noto Sans KR','Apple SD Gothic Neo','Malgun Gothic',sans-serif;
  --body:'Noto Sans KR','Apple SD Gothic Neo','Malgun Gothic',sans-serif;
  --sun:var(--accent); --sun-ink:var(--accent-ink); --sky:var(--primary); --sky-ink:var(--primary-ink); --coral:var(--rose); --line:color-mix(in srgb, var(--ink) 45%, transparent);
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#12172B; --surface:#1B2140; --surface-2:#202750; --surface-3:#262E5A; --ink:#EEF1FB; --ink-soft:#9AA4C7; --hair:rgba(238,241,251,.10);
    --accent:#FF9A55; --accent-ink:#2A1503; --accent-glow:rgba(255,154,85,.4);
    --primary:#7B90FF; --primary-ink:#0F1533; --primary-soft:#2A335F;
    --mint:#3BD293; --mint-soft:#1B4A3A; --rose:#FF7C8A; --rose-soft:#5A2A33; --grape:#A78CFF;
    --key:#242C55; --key-ink:#EEF1FB; --key-sub:#7F8AB0; --key-shadow:rgba(0,0,0,.35);
    --shadow-soft:0 8px 24px rgba(0,0,0,.35);
  }
}
:root[data-theme="dark"]{
  --bg:#12172B; --surface:#1B2140; --surface-2:#202750; --surface-3:#262E5A; --ink:#EEF1FB; --ink-soft:#9AA4C7; --hair:rgba(238,241,251,.10);
  --accent:#FF9A55; --accent-ink:#2A1503; --accent-glow:rgba(255,154,85,.4);
  --primary:#7B90FF; --primary-ink:#0F1533; --primary-soft:#2A335F;
  --mint:#3BD293; --mint-soft:#1B4A3A; --rose:#FF7C8A; --rose-soft:#5A2A33; --grape:#A78CFF;
  --key:#242C55; --key-ink:#EEF1FB; --key-sub:#7F8AB0; --key-shadow:rgba(0,0,0,.35);
  --shadow-soft:0 8px 24px rgba(0,0,0,.35);
}
*{box-sizing:border-box}
[hidden]{display:none!important}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--body);font-size:15px;line-height:1.5;-webkit-font-smoothing:antialiased}
button{font-family:inherit;color:inherit;cursor:pointer}
button:focus-visible,input:focus-visible{outline:3px solid var(--primary);outline-offset:2px}
.app{max-width:1060px;margin:0 auto;padding:22px 20px 32px;display:flex;flex-direction:column;gap:18px}

/* ---------- header ---------- */
.top{display:flex;align-items:center;justify-content:space-between;gap:14px;flex-wrap:wrap}
.logo{display:flex;align-items:baseline;gap:10px}
.logo-mark{font-family:var(--display);font-size:34px;line-height:1;letter-spacing:-.01em;color:var(--ink)}
.logo-mark::after{content:"";display:inline-block;width:10px;height:10px;border-radius:50%;background:var(--accent);margin-left:6px;vertical-align:baseline}
.logo-sub{font-size:12.5px;color:var(--ink-soft);letter-spacing:.1em;font-weight:500}
.controls{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.name-box{display:flex;align-items:center;gap:6px;background:var(--surface);border:1px solid var(--hair);border-radius:999px;padding:4px 6px 4px 14px;height:40px}
.name-box span{font-size:12.5px;color:var(--ink-soft);font-weight:700}
.name-box input{border:0;background:var(--surface-3);border-radius:999px;padding:5px 12px;width:96px;height:30px;font:inherit;font-weight:700;color:var(--ink)}
.seg{display:flex;background:var(--surface);border:1px solid var(--hair);border-radius:999px;padding:3px;height:40px}
.seg button{border:0;background:transparent;border-radius:999px;padding:0 14px;font-weight:700;font-size:13.5px;color:var(--ink-soft);transition:background .15s,color .15s}
.seg button.on{background:var(--primary);color:var(--primary-ink)}
.seg button:hover:not(.on){color:var(--ink);background:var(--surface-3)}
.icon-btn{border:1px solid var(--hair);background:var(--surface);border-radius:999px;padding:0 14px;height:40px;font-weight:700;font-size:13.5px;color:var(--ink)}
.icon-btn[aria-pressed="false"]{color:var(--ink-soft);text-decoration:line-through}

/* ---------- tabs ---------- */
.tabs{display:flex;gap:4px;padding:0 6px}
.tabs button{border:0;background:transparent;padding:10px 16px 12px;font-size:17px;font-weight:700;color:var(--ink-soft);position:relative;border-radius:10px 10px 0 0}
.tabs button::after{content:"";position:absolute;left:16px;right:16px;bottom:4px;height:3px;border-radius:3px;background:transparent;transition:background .15s}
.tabs button.on{color:var(--ink)} .tabs button.on::after{background:var(--accent)}
.tabs button:hover:not(.on){color:var(--ink)}
.board{background:var(--surface);border:1px solid var(--hair);border-radius:22px;box-shadow:var(--shadow-soft);padding:18px;display:flex;flex-direction:column;gap:16px}

/* ---------- stats ---------- */
.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:10px}
.stat{background:var(--surface-2);border-radius:14px;padding:10px 14px 9px;display:flex;flex-direction:column;gap:0}
.stat b{font-size:28px;line-height:1.15;font-weight:700;font-variant-numeric:tabular-nums;letter-spacing:-.01em}
.stat span{font-size:12px;color:var(--ink-soft);font-weight:700;letter-spacing:.03em}
.stat.good b{color:var(--mint)} .stat.warn b{color:var(--rose)}
.hearts{display:inline-flex;gap:4px;line-height:1;vertical-align:middle}
.hearts i{display:inline-block;width:22px;height:22px;background:var(--rose);
  clip-path:path("M12 21s-7.5-4.8-9.6-9.3C.9 8.5 2.6 4.5 6.4 4.1c2.3-.2 4 1 5.6 2.9C13.6 5.1 15.3 3.9 17.6 4.1c3.8.4 5.5 4.4 4 7.6C19.5 16.2 12 21 12 21z")}
.hearts i.off{background:var(--surface-3)}

/* ---------- stage ---------- */
.stage{position:relative;min-height:300px;border-radius:18px;background:var(--surface-2);overflow:hidden;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:18px;padding:24px}
.target{font-size:clamp(26px,3.6vw,40px);line-height:1.55;text-align:center;max-width:min(100%,34ch);font-weight:500;letter-spacing:.01em;text-wrap:balance;word-break:keep-all}
.target .w{display:inline-block;white-space:nowrap}
.target.big{font-size:clamp(96px,16vw,150px);line-height:1;font-weight:700}
.target .c{display:inline-block;border-radius:6px;padding:0 1px;min-width:.35em;text-align:center;border-bottom:3px solid transparent}
.target .c.done{color:var(--mint)}
.target .c.cur{background:var(--accent);color:var(--accent-ink);box-shadow:0 0 0 4px var(--accent-glow)}
.target .c.todo{color:var(--ink)}
.target .c.sp{border-bottom:3px dotted var(--hair);min-width:.5em}
.target .c.sp.cur{border-bottom-color:var(--accent-ink)}
.typed{font-size:clamp(24px,3.2vw,36px);min-height:1.5em;line-height:1.5;font-weight:500;letter-spacing:.01em;text-align:center;color:var(--ink-soft);display:flex;align-items:center;justify-content:center;flex-wrap:wrap;white-space:pre-wrap;word-break:keep-all;max-width:min(100%,34ch)}
.typed.big{font-size:clamp(60px,10vw,96px);line-height:1;color:var(--ink)}
.caret{display:inline-block;width:3px;height:1.1em;background:var(--primary);margin-left:2px;border-radius:2px;animation:blink 1s steps(2) infinite;vertical-align:middle}
@keyframes blink{50%{opacity:0}}
.progress{width:100%;max-width:520px;height:8px;border-radius:8px;background:var(--surface-3);overflow:hidden}
.progress i{display:block;height:100%;width:0;background:var(--mint);transition:width .25s;border-radius:8px}
.item-count{font-size:12.5px;font-weight:700;color:var(--ink-soft);letter-spacing:.06em}

.overlay{position:absolute;inset:0;z-index:5;background:color-mix(in srgb, var(--surface) 88%, transparent);backdrop-filter:blur(6px);-webkit-backdrop-filter:blur(6px);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:10px;text-align:center;padding:24px}
.overlay h2{font-size:clamp(24px,3vw,34px);font-weight:700;margin:0;line-height:1.25;text-wrap:balance;max-width:32ch;word-break:keep-all;letter-spacing:-.01em}
.overlay p{margin:0;color:var(--ink-soft);font-weight:500;max-width:38ch;word-break:keep-all}
.overlay .tier{font-size:44px;line-height:1}
.overlay .sub{color:var(--ink);font-weight:700;font-size:16px}
.overlay .gicon-big svg{width:64px;height:64px;display:block}
.big-btn{border:0;background:var(--accent);color:var(--accent-ink);font-size:18px;font-weight:700;border-radius:999px;padding:12px 30px;box-shadow:0 6px 18px var(--accent-glow);transition:transform .1s, box-shadow .1s}
.big-btn:hover{transform:translateY(-1px);box-shadow:0 8px 22px var(--accent-glow)}
.big-btn:active{transform:translateY(1px);box-shadow:0 3px 10px var(--accent-glow)}
.big-btn.alt{background:var(--surface);color:var(--ink);box-shadow:none;border:1px solid var(--hair);font-size:16px;padding:11px 22px}
.big-btn.alt:hover{background:var(--surface-3);box-shadow:none}
.btn-row{display:flex;gap:10px;flex-wrap:wrap;justify-content:center;margin-top:8px}
.hint-key{font-size:12.5px;color:var(--ink-soft)}
.hint-key kbd{font-family:inherit;border:1px solid var(--hair);border-radius:6px;padding:0 6px;background:var(--surface);font-weight:700}
.stars{display:flex;gap:6px;line-height:1}
.stars i{display:inline-block;width:40px;height:40px;background:var(--surface-3);
  clip-path:polygon(50% 2%,62% 36%,98% 38%,69% 60%,79% 96%,50% 75%,21% 96%,31% 60%,2% 38%,38% 36%)}
.stars i.on{background:var(--accent)}
.result-grid{display:grid;grid-template-columns:repeat(3,auto);gap:8px 26px;margin:6px 0}
.result-grid b{font-size:32px;font-weight:700;line-height:1;display:block;font-variant-numeric:tabular-nums;letter-spacing:-.01em}
.result-grid span{font-size:12px;color:var(--ink-soft);font-weight:700}

/* ---------- game ---------- */
.games{display:grid;grid-template-columns:repeat(2,1fr);gap:8px}
.gcard{border:1px solid var(--hair);background:var(--surface-2);border-radius:12px;padding:8px 12px;text-align:left;display:grid;grid-template-columns:36px 1fr;grid-template-areas:"icon name" "icon desc";column-gap:10px;row-gap:0;align-items:center;transition:background .15s,border-color .15s}
.gcard .gicon{grid-area:icon;width:36px;height:36px;display:flex;align-items:center;justify-content:center;background:var(--surface);border-radius:10px;color:var(--ink);box-shadow:0 1px 4px rgba(27,35,64,.06)}
.gcard .gicon svg{width:28px;height:28px;display:block}
.gcard b{grid-area:name;font-size:15px;font-weight:700;line-height:1.25;align-self:end}
.gcard span.gdesc{grid-area:desc;font-size:11.5px;color:var(--ink-soft);font-weight:500;line-height:1.3;word-break:keep-all;align-self:start}
.gcard.on{background:var(--primary-soft);border-color:var(--primary);color:var(--ink)} .gcard.on b{color:var(--primary)}
.gcard:hover:not(.on){background:var(--surface-3)}
#gStage{min-height:440px;padding:0}
.garea{position:absolute;inset:0;overflow:hidden}
.g-rain{background:linear-gradient(180deg, color-mix(in srgb, var(--primary) 14%, var(--surface-2)) 0%, var(--surface-2) 70%)}
.g-mole{background:linear-gradient(180deg, color-mix(in srgb, var(--primary) 8%, var(--surface-2)), color-mix(in srgb, var(--mint) 20%, var(--surface-2)))}
.g-race{background:linear-gradient(180deg, color-mix(in srgb, var(--primary) 12%, var(--surface-2)) 0 40%, color-mix(in srgb, var(--mint) 16%, var(--surface-2)) 40%)}
.g-memory{background:color-mix(in srgb, var(--grape) 10%, var(--surface-2))}
.g-sprint{background:color-mix(in srgb, var(--accent) 12%, var(--surface-2))}
.word{position:absolute;top:-10%;left:0;transform:translateX(-50%);background:var(--surface);border-radius:12px;padding:6px 14px;font-size:clamp(20px,2.6vw,28px);font-weight:700;box-shadow:0 6px 16px rgba(27,35,64,.14);white-space:nowrap;will-change:top}
.word.easy{font-size:clamp(34px,5vw,48px);padding:6px 18px}
.word.lock{box-shadow:0 0 0 3px var(--primary),0 6px 16px rgba(27,35,64,.14)}
.word.pop{animation:pop .3s forwards}
@keyframes pop{to{transform:translateX(-50%) scale(1.5);opacity:0}}
.ground{position:absolute;left:0;right:0;bottom:0;height:8%;background:var(--mint);opacity:.8}
.buffer{position:absolute;left:50%;bottom:11%;transform:translateX(-50%);z-index:2;background:var(--surface);border-radius:14px;padding:6px 18px;min-width:180px;min-height:52px;font-size:28px;font-weight:700;display:flex;align-items:center;justify-content:center;box-shadow:var(--shadow-soft);white-space:nowrap}
.buffer .ph{color:var(--ink-soft);font-size:14px;font-weight:700}
/* 두더지 */
.holes{position:absolute;inset:12px 16px 100px;display:grid;grid-template-columns:repeat(3,1fr);gap:10px 14px}
.hole{position:relative;overflow:hidden;border-radius:16px}
.hole .dirt{position:absolute;left:10%;right:10%;bottom:0;height:26%;background:#8B6446;border-radius:50%/60% 60% 40% 40%;box-shadow:inset 0 4px 0 rgba(0,0,0,.15)}
.mole{position:absolute;left:50%;bottom:16px;width:58px;height:62px;transform:translate(-50%,120%);transition:transform .18s ease-out;background:radial-gradient(circle at 34% 40%, var(--ink) 7%, transparent 8%),radial-gradient(circle at 66% 40%, var(--ink) 7%, transparent 8%),#B07E58;border-radius:46% 46% 40% 40%/50% 50% 38% 38%;display:flex;justify-content:center}
.mole::after{content:"";position:absolute;top:52%;left:50%;transform:translateX(-50%);width:22%;height:14%;border-radius:50%;background:#F4B5B5}
.mole.up{transform:translate(-50%,0)}
.mole.bonk{transform:translate(-50%,120%) !important;transition:transform .12s ease-in}
.mole .mtext{position:absolute;top:-26px;background:var(--surface);border-radius:10px;padding:2px 12px;font-size:clamp(16px,2vw,22px);font-weight:700;white-space:nowrap;box-shadow:0 4px 12px rgba(27,35,64,.16)}
.mole.lock .mtext{box-shadow:0 0 0 3px var(--primary),0 4px 12px rgba(27,35,64,.16)}
/* 경주 */
.track{position:absolute;left:18px;right:18px;top:18px;height:150px;display:flex;flex-direction:column;justify-content:space-around}
.lane{position:relative;height:56px;border-bottom:2px dashed var(--hair)}
.lane .runner{position:absolute;bottom:2px;left:0;width:70px;transition:left .15s linear}
.lane .runner svg{width:70px;height:46px;display:block;overflow:visible}
.lane .tag{position:absolute;left:2px;top:-2px;font-size:12px;font-weight:700;color:var(--ink-soft)}
.finish{position:absolute;right:16px;top:12px;height:156px;width:12px;background:repeating-conic-gradient(var(--ink) 0 25%, var(--surface) 0 50%) 0 0/12px 12px;border-radius:4px;opacity:.85}
.race-text{position:absolute;left:18px;right:18px;top:190px;bottom:14px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:8px}
.race-text .target{font-size:clamp(20px,2.6vw,30px)} .race-text .typed{font-size:clamp(18px,2.2vw,26px);min-height:1.4em}
.runner.stumble{animation:stumble .3s}
@keyframes stumble{30%{transform:rotate(-12deg)}70%{transform:rotate(8deg)}}
/* 기억 */
.mem{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:18px;padding:20px}
.mem .show{font-size:clamp(40px,6vw,72px);font-weight:700;line-height:1.2;text-align:center;word-break:keep-all}
.mem .timer{width:min(60%,320px);height:8px;border-radius:8px;background:var(--surface-3);overflow:hidden}
.mem .timer i{display:block;height:100%;background:var(--grape);width:100%}
.mem .boxes{display:flex;gap:8px;flex-wrap:wrap;justify-content:center;max-width:90%}
.mem .box{min-width:54px;height:66px;padding:0 8px;border-radius:12px;background:var(--surface);display:flex;align-items:center;justify-content:center;font-size:clamp(28px,3.6vw,40px);font-weight:700;color:var(--ink-soft);box-shadow:0 4px 12px rgba(27,35,64,.10)}
.mem .box.done{color:var(--mint)} .mem .box.cur{background:var(--accent);color:var(--accent-ink);box-shadow:0 0 0 4px var(--accent-glow)} .mem .box.gap{border:2px dashed var(--hair);box-shadow:none;background:transparent;min-width:22px}
.mem .note{font-size:14px;font-weight:700;color:var(--ink-soft)}
/* 번개 */
.sprint{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:12px;padding:20px}
.sprint .target{font-size:clamp(44px,7vw,84px);line-height:1.2}
.sprint .typed{font-size:clamp(28px,4vw,48px)}
.sprint .bolt{position:absolute;right:20px;top:12px;font-size:56px;font-weight:700;line-height:1;color:var(--ink-soft);font-variant-numeric:tabular-nums}
.stage.g-sprint .bolt.low{color:var(--rose)}
/* 괴물 */
.g-boss{background:color-mix(in srgb, var(--rose) 9%, var(--surface-2))}
.boss{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:10px;padding:16px}
.boss .monster svg{width:118px;height:104px;display:block}
.boss .monster{transition:transform .1s}
.boss .monster.hit{animation:mhit .28s}
@keyframes mhit{30%{transform:translateX(-10px) rotate(-6deg)}70%{transform:translateX(7px) rotate(4deg)}}
.boss .monster.attack{animation:mattack .4s}
@keyframes mattack{40%{transform:translateY(18px) scale(1.12)}}
.boss .hpwrap{display:flex;align-items:center;gap:8px;font-size:12.5px;font-weight:700;color:var(--ink-soft)}
.boss .hpbar{width:200px;height:12px;background:var(--surface-3);border-radius:8px;overflow:hidden}
.boss .hpbar i{display:block;height:100%;background:var(--rose);transition:width .2s;border-radius:8px}
.boss .gauge{display:flex;align-items:center;gap:8px;font-size:12px;font-weight:700;color:var(--ink-soft)}
.boss .gbar{width:160px;height:8px;background:var(--surface-3);border-radius:8px;overflow:hidden}
.boss .gbar i{display:block;height:100%;background:var(--accent);width:0;border-radius:8px}
.boss .target{font-size:clamp(30px,4.6vw,56px);line-height:1.3;margin-top:4px}
.boss .typed{font-size:clamp(22px,3vw,34px)}
.stage.shake{animation:shake .35s}
@keyframes shake{20%{transform:translateX(-6px)}40%{transform:translateX(6px)}60%{transform:translateX(-4px)}80%{transform:translateX(4px)}}

/* ---------- records ---------- */
.bests{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.best{background:var(--surface-2);border-radius:14px;padding:12px 16px}
.best span{font-size:12px;color:var(--ink-soft);font-weight:700;letter-spacing:.03em}
.best b{font-size:30px;font-weight:700;line-height:1.15;display:block;font-variant-numeric:tabular-nums;letter-spacing:-.01em}
.best small{color:var(--ink-soft);font-weight:500}
.tbl-wrap{overflow-x:auto;border:1px solid var(--hair);border-radius:14px}
table{width:100%;border-collapse:collapse;font-size:14px;min-width:560px}
th,td{padding:9px 14px;text-align:left;border-bottom:1px solid var(--hair);white-space:nowrap}
th{background:var(--surface-2);font-size:12px;letter-spacing:.06em;color:var(--ink-soft);font-weight:700}
tr:last-child td{border-bottom:0}
td.num{font-variant-numeric:tabular-nums;font-weight:700}
.pill{display:inline-block;border-radius:999px;padding:1px 10px;font-size:12px;font-weight:700}
.pill.ko{background:var(--accent);color:var(--accent-ink)} .pill.en{background:var(--primary-soft);color:var(--primary)}
.pill.game{background:color-mix(in srgb, var(--grape) 18%, transparent);color:var(--grape)}
.empty{padding:28px;text-align:center;color:var(--ink-soft);font-weight:500}
.rec-foot{display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap;color:var(--ink-soft);font-size:13px}
.small-btn{border:1px solid var(--hair);background:var(--surface);border-radius:999px;padding:6px 14px;font-weight:700;font-size:13px}
.small-btn.danger{color:var(--rose)}

/* ---------- keyboard ---------- */

.key.w-1_4{flex-grow:1.4} .key.w-1_6{flex-grow:1.6} .key.w-1_7{flex-grow:1.7} .key.w-7{flex-grow:7}

/* 양손 그림 */

.burst{position:absolute;width:10px;height:10px;border-radius:50%;pointer-events:none;animation:fly .6s ease-out forwards}

<script>
/* ===================== 한글 분해·조합 ===================== */
const CHO='ㄱㄲㄴㄷㄸㄹㅁㅂㅃㅅㅆㅇㅈㅉㅊㅋㅌㅍㅎ';
const JUNG='ㅏㅐㅑㅒㅓㅔㅕㅖㅗㅘㅙㅚㅛㅜㅝㅞㅟㅠㅡㅢㅣ';
const JONG=['','ㄱ','ㄲ','ㄳ','ㄴ','ㄵ','ㄶ','ㄷ','ㄹ','ㄺ','ㄻ','ㄼ','ㄽ','ㄾ','ㄿ','ㅀ','ㅁ','ㅂ','ㅄ','ㅅ','ㅆ','ㅇ','ㅈ','ㅊ','ㅋ','ㅌ','ㅍ','ㅎ'];
const JUNG_SPLIT={'ㅘ':'ㅗㅏ','ㅙ':'ㅗㅐ','ㅚ':'ㅗㅣ','ㅝ':'ㅜㅓ','ㅞ':'ㅜㅔ','ㅟ':'ㅜㅣ','ㅢ':'ㅡㅣ'};
const JONG_SPLIT={'ㄳ':'ㄱㅅ','ㄵ':'ㄴㅈ','ㄶ':'ㄴㅎ','ㄺ':'ㄹㄱ','ㄻ':'ㄹㅁ','ㄼ':'ㄹㅂ','ㄽ':'ㄹㅅ','ㄾ':'ㄹㅌ','ㄿ':'ㄹㅍ','ㅀ':'ㄹㅎ','ㅄ':'ㅂㅅ'};
const JUNG_JOIN=Object.fromEntries(Object.entries(JUNG_SPLIT).map(([k,v])=>[v,k]));
const JONG_JOIN=Object.fromEntries(Object.entries(JONG_SPLIT).map(([k,v])=>[v,k]));

// 글자 하나 → 실제로 눌러야 하는 키(자모) 순서
function keysOf(ch){
  const code=ch.charCodeAt(0);
  if(code>=0xAC00&&code<=0xD7A3){
    const i=code-0xAC00;
    const cho=CHO[Math.floor(i/588)], jung=JUNG[Math.floor((i%588)/28)], jong=JONG[i%28];
    return [cho, ...(JUNG_SPLIT[jung]||jung), ...(jong?(JONG_SPLIT[jong]||jong):'')];
  }
  if(JUNG_SPLIT[ch]) return [...JUNG_SPLIT[ch]];
  if(JONG_SPLIT[ch]) return [...JONG_SPLIT[ch]];
  return [ch];
}
// 자모 순서 → 화면에 보이는 글자 (두벌식 오토마타)
function compose(keys){
  let out='',cho=null,jung=null,jong=null;
  const flush=()=>{
    if(cho!==null&&jung!==null){
      out+=String.fromCharCode(0xAC00+(CHO.indexOf(cho)*21+JUNG.indexOf(jung))*28+Math.max(0,JONG.indexOf(jong||'')));
    } else if(cho!==null) out+=cho;
    else if(jung!==null) out+=jung;
    cho=jung=jong=null;
  };
  for(const k of keys){
    const isJung=JUNG.includes(k), isCho=CHO.includes(k);
    if(isJung){
      if(cho!==null&&jung===null){ jung=k; }
      else if(cho!==null&&jong===null){ const j=JUNG_JOIN[jung+k]; if(j) jung=j; else { flush(); jung=k; } }
      else if(cho!==null){ // 받침이 다음 글자 첫소리로 넘어감
        let carry=jong, stay=null; const sp=JONG_SPLIT[jong]; if(sp){ stay=sp[0]; carry=sp[1]; }
        jong=stay; flush(); cho=carry; jung=k;
      }
      else if(jung!==null){ const j=JUNG_JOIN[jung+k]; if(j) jung=j; else { flush(); jung=k; } }
      else { jung=k; }
    } else if(isCho){
      if(cho===null&&jung===null){ cho=k; }
      else if(cho===null){ flush(); cho=k; }
      else if(jung===null){ flush(); cho=k; }
      else if(jong===null){ if(JONG.includes(k)) jong=k; else { flush(); cho=k; } }
      else { const j=JONG_JOIN[jong+k]; if(j) jong=j; else { flush(); cho=k; } }
    } else { flush(); out+=k; }
  }
  flush(); return out;
}
// 문장의 앞부분 n개 키만 쳤을 때 보이는 글자
function renderPrefix(text,n){
  let out='',left=n;
  for(const ch of text){
    if(left<=0) break;
    const ks=keysOf(ch);
    if(left>=ks.length){ out+=ch; left-=ks.length; }
    else { out+=compose(ks.slice(0,left)); left=0; }
  }
  return out;
}

/* ===================== 키보드 자판 ===================== */
// [코드, 영어, 한글, 한글(Shift), 너비]
const ROWS=[
  [['KeyQ','q','ㅂ','ㅃ'],['KeyW','w','ㅈ','ㅉ'],['KeyE','e','ㄷ','ㄸ'],['KeyR','r','ㄱ','ㄲ'],['KeyT','t','ㅅ','ㅆ'],['KeyY','y','ㅛ'],['KeyU','u','ㅕ'],['KeyI','i','ㅑ'],['KeyO','o','ㅐ','ㅒ'],['KeyP','p','ㅔ','ㅖ'],['Backspace','지움',null,null,'1_6']],
  [['KeyA','a','ㅁ'],['KeyS','s','ㄴ'],['KeyD','d','ㅇ'],['KeyF','f','ㄹ'],['KeyG','g','ㅎ'],['KeyH','h','ㅗ'],['KeyJ','j','ㅓ'],['KeyK','k','ㅏ'],['KeyL','l','ㅣ'],['Semicolon',';'],['Quote',"'"],['Enter','엔터',null,null,'1_4']],
  [['ShiftLeft','Shift',null,null,'1_7'],['KeyZ','z','ㅋ'],['KeyX','x','ㅌ'],['KeyC','c','ㅊ'],['KeyV','v','ㅍ'],['KeyB','b','ㅠ'],['KeyN','n','ㅜ'],['KeyM','m','ㅡ'],['Comma',','],['Period','.'],['Slash','/'],['ShiftRight','Shift',null,null,'1_7']],
  [['Space','',null,null,'7']]
];
const PUNCT={Semicolon:[';',':'],Quote:["'",'"'],Comma:[',','<'],Period:['.','>'],Slash:['/','?'],Space:[' ',' ']};
const FINGER={KeyQ:'lp',KeyA:'lp',KeyZ:'lp',ShiftLeft:'lp',KeyW:'lr',KeyS:'lr',KeyX:'lr',KeyE:'lm',KeyD:'lm',KeyC:'lm',
  KeyR:'li',KeyF:'li',KeyV:'li',KeyT:'li',KeyG:'li',KeyB:'li',KeyY:'ri',KeyH:'ri',KeyN:'ri',KeyU:'ri',KeyJ:'ri',KeyM:'ri',
  KeyI:'rm',KeyK:'rm',Comma:'rm',KeyO:'rr',KeyL:'rr',Period:'rr',KeyP:'rp',Semicolon:'rp',Quote:'rp',Slash:'rp',ShiftRight:'rp',Enter:'rp',Backspace:'rp',Space:'th'};
const FINGER_NAME={lp:'왼손 새끼손가락',lr:'왼손 넷째손가락',lm:'왼손 가운뎃손가락',li:'왼손 둘째손가락',ri:'오른손 둘째손가락',rm:'오른손 가운뎃손가락',rr:'오른손 넷째손가락',rp:'오른손 새끼손가락',th:'엄지'};
const FINGER_COLOR={lp:'var(--f-pinky)',rp:'var(--f-pinky)',lr:'var(--f-ring)',rr:'var(--f-ring)',lm:'var(--f-mid)',rm:'var(--f-mid)',li:'var(--f-index)',ri:'var(--f-index)',th:'var(--f-thumb)'};

const KEYS={}, KEY_FOR={};
ROWS.flat().forEach(([code,en,ko,koShift])=>{
  KEYS[code]={en,ko,koShift};
  if(/^[a-z]$/.test(en)){ KEY_FOR[en]={code,shift:false}; KEY_FOR[en.toUpperCase()]={code,shift:true}; }
  if(ko) KEY_FOR[ko]={code,shift:false};
  if(koShift) KEY_FOR[koShift]={code,shift:true};
});
Object.entries(PUNCT).forEach(([code,[a,b]])=>{ KEY_FOR[a]={code,shift:false}; if(b!==a) KEY_FOR[b]={code,shift:true}; });

const shuffle=a=>{a=[...a];for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]];}return a;};
const pick=a=>a[Math.floor(Math.random()*a.length)];
function makeItems(lang,level){
  if(level==='easy'){
    const home=lang==='ko'?HOME_KO:HOME_EN, all=lang==='ko'?ALL_KO:ALL_EN, out=[]; let prev='';
    for(let i=0;i<20;i++){ let c; do{ c=pick(i<10?home:all);}while(c===prev); out.push(c); prev=c; }
    return out;
  }
  if(level==='mid') return shuffle(lang==='ko'?WORDS_KO:WORDS_EN).slice(0,10);
  return shuffle(lang==='ko'?SENT_KO:SENT_EN).slice(0,5);
}

const Sfx={ctx:null,on:true,
  ensure(){ if(!this.ctx){ try{ this.ctx=new (window.AudioContext||window.webkitAudioContext)(); }catch(e){} } if(this.ctx&&this.ctx.state==='suspended') this.ctx.resume(); },
  tone(f,d,type='sine',v=.12,when=0){ if(!this.on||!this.ctx) return; const o=this.ctx.createOscillator(),g=this.ctx.createGain(); o.type=type; o.frequency.value=f; const t=this.ctx.currentTime+when; g.gain.setValueAtTime(v,t); g.gain.exponentialRampToValueAtTime(.001,t+d); o.connect(g).connect(this.ctx.destination); o.start(t); o.stop(t+d+.02); },
  ok(){ this.tone(880,.07,'triangle',.1); },
  bad(){ this.tone(150,.16,'square',.06); },
  done(){ [523,659,784].forEach((f,i)=>this.tone(f,.14,'triangle',.11,i*.08)); },
  finish(){ [523,659,784,1046].forEach((f,i)=>this.tone(f,.22,'triangle',.12,i*.12)); },
  pop(){ this.tone(1300,.08,'sine',.09); this.tone(650,.12,'triangle',.07); },
  life(){ this.tone(220,.28,'sawtooth',.08); },
  over(){ [392,330,262].forEach((f,i)=>this.tone(f,.25,'sawtooth',.07,i*.16)); }
};

const keyEls={};
(function buildKb(){
  const kb=$('kb');
  ROWS.forEach(row=>{
    const r=document.createElement('div'); r.className='row';
    row.forEach(([code,en,ko,koShift,w])=>{
      const k=document.createElement('button'); k.type='button'; k.tabIndex=-1;
      k.className='key f-'+(FINGER[code]||'th')+(w?' w-'+w:'')+(/^[a-z]$/.test(en)||PUNCT[code]?'':' fn');
      k.dataset.code=code;
      k.innerHTML='<span class="sub"></span><span class="shifted"></span><span class="main"></span><span class="fdot"></span>';
      k.addEventListener('pointerdown',e=>{ e.preventDefault(); Sfx.ensure(); onVirtualKey(code); });
      r.appendChild(k); keyEls[code]=k;
    });
    kb.appendChild(r);
  });
  paintKb();
})();
function paintKb(){
  Object.entries(KEYS).forEach(([code,{en,ko,koShift}])=>{
    const el=keyEls[code], main=el.querySelector('.main'), sub=el.querySelector('.sub'), sh=el.querySelector('.shifted');
    if(/^[a-z]$/.test(en)){
      if(state.lang==='ko'){ main.textContent=ko; sub.textContent=en.toUpperCase(); sh.textContent=koShift||''; }
      else { main.textContent=en.toUpperCase(); sub.textContent=ko; sh.textContent=''; }
    } else if(PUNCT[code]){ main.textContent=PUNCT[code][0]; sub.textContent=''; sh.textContent=PUNCT[code][1]===PUNCT[code][0]?'':PUNCT[code][1]; }
    else { main.textContent=en; sub.textContent=''; sh.textContent=''; }
  });
}

const fingerEls={};
(function buildHands(){
  // 손가락: [이름, x, 위쪽 y, 높이]  (왼손 기준, 오른손은 좌우 반전)
  const FINGERS=[['p',22,58,110],['r',60,26,140],['m',98,12,154],['i',136,28,138]];
  const hand=side=>{
    const L=side==='l';
    const parts=FINGERS.map(([f,x,y,h])=>`<g class="finger f-${side}${f}" data-finger="${side}${f}"><rect x="${x}" y="${y}" width="34" height="${h}" rx="17"/><text class="tip" x="${x+17}" y="${y+42}"></text></g>`).join('');
    const thumb=`<g class="finger f-${side}t" data-finger="${side}t"><rect x="160" y="110" width="34" height="80" rx="17" transform="rotate(38 177 190)"/><text class="tip" x="216" y="150"></text></g>`;
    const palm=`<rect class="palm" x="20" y="104" width="152" height="120" rx="46"/>`;
    const W=250;
    return `<svg class="hand hand-${side}" viewBox="0 -28 ${W} 280"><g transform="${L?'':`translate(${W} 0) scale(-1 1)`}">${parts}${thumb}${palm}</g><text class="label" x="${L?96:W-96}" y="247">${L?'왼손':'오른손'}</text></svg>`;
  };
  $('hands').innerHTML=hand('l')+hand('r');
  $('hands').querySelectorAll('.finger').forEach(g=>fingerEls[g.dataset.finger]=g);
  // 오른손은 좌우가 반전되어 글자가 뒤집히므로 되돌림
  $('hands').querySelectorAll('.hand-r .tip').forEach(t=>{ t.setAttribute('transform',`translate(${t.getAttribute('x')*2} 0) scale(-1 1)`); });
})();
function setHands(k,label){
  Object.values(fingerEls).forEach(g=>{ g.classList.remove('active','shift'); g.querySelector('.tip').textContent=''; });
  if(!k) return;
  const f=FINGER[k.code]||'th';
  const show=(id,text,shift)=>{ const g=fingerEls[id]; if(!g) return; g.classList.add('active'); if(shift) g.classList.add('shift'); g.querySelector('.tip').textContent=text; };
  if(f==='th'){ show('lt',label); show('rt',label); }
  else { show(f,label); if(k.shift) show(f[0]==='l'?'rp':'lp','Shift',true); }
}
let nextCodes=[];
function setNext(ch){
  nextCodes.forEach(c=>keyEls[c]&&keyEls[c].classList.remove('next')); nextCodes=[];
  const hint=$('nextHint');
  if(!ch){ hint.innerHTML=''; setHands(null); return; }
  const k=KEY_FOR[ch]; if(!k){ hint.innerHTML=''; setHands(null); return; }
  nextCodes.push(k.code); if(k.shift){ nextCodes.push('ShiftLeft','ShiftRight'); }
  nextCodes.forEach(c=>keyEls[c]&&keyEls[c].classList.add('next'));
  const f=FINGER[k.code]||'th';
  const label=ch===' '?'띄어쓰기':ch;
  setHands(k,ch===' '?'␣':ch);
  hint.innerHTML=`<span>다음 키</span><span class="key-chip">${label}</span>${k.shift?'<span>+ Shift</span>':''}<span class="finger"><i class="dot" style="background:${FINGER_COLOR[f]}"></i>${FINGER_NAME[f]}</span>`;
}
function flashKey(code,cls){
  const el=keyEls[code]; if(!el) return;
  el.classList.remove('hit','miss'); void el.offsetWidth; el.classList.add(cls);
  setTimeout(()=>el.classList.remove(cls),160);
}
function tokenFor(code,shift){
  const k=KEYS[code];
  if(k&&/^[a-z]$/.test(k.en)){ if(state.lang==='ko') return shift&&k.koShift?k.koShift:k.ko; return shift?k.en.toUpperCase():k.en; }
  if(PUNCT[code]) return PUNCT[code][shift?1:0];
  return null;
}
function onVirtualKey(code){
  if(code==='ShiftLeft'||code==='ShiftRight'){ state.stickyShift=!state.stickyShift; ['ShiftLeft','ShiftRight'].forEach(c=>keyEls[c].classList.toggle('sticky',state.stickyShift)); return; }
  handleKey(code,state.stickyShift);
  if(state.stickyShift){ state.stickyShift=false; ['ShiftLeft','ShiftRight'].forEach(c=>keyEls[c].classList.remove('sticky')); }
}
document.addEventListener('keydown',e=>{
  const t=e.target; if(t&&(t.tagName==='INPUT'||t.tagName==='TEXTAREA'||t.isContentEditable)) return;
  if(e.metaKey||e.ctrlKey||e.altKey) return;
  Sfx.ensure();
  let code=e.code;
  if(!code){ // 일부 기기용 대체 처리
    if(/^[a-zA-Z]$/.test(e.key)) code='Key'+e.key.toUpperCase();
    else if(KEY_FOR[e.key]) code=KEY_FOR[e.key].code;
    else if(e.key===' ') code='Space'; else if(e.key==='Backspace') code='Backspace'; else if(e.key==='Enter') code='Enter';
  }
  if(code==='ShiftLeft'||code==='ShiftRight'){ return; }
  if(handleKey(code,e.shiftKey)) e.preventDefault();
});
document.addEventListener('pointerdown',()=>Sfx.ensure(),{once:true});
// 버튼을 누른 뒤에도 키보드 입력이 연습 화면으로 가도록 포커스를 풀어 줌

function handleKey(code,shift){
  if(state.tab==='practice') return P.key(code,shift);
  if(state.tab==='game') return G.key(code,shift);
  return false;
}
function burst(stage,x,y,color){
  if(matchMedia('(prefers-reduced-motion: reduce)').matches) return;
  for(let i=0;i<10;i++){
    const b=document.createElement('i'); b.className='burst';
    const a=Math.random()*Math.PI*2, d=50+Math.random()*60;
    b.style.cssText=`left:${x}px;top:${y}px;background:${color};--dx:${Math.cos(a)*d}px;--dy:${Math.sin(a)*d}px`;
    stage.appendChild(b); setTimeout(()=>b.remove(),650);
  }
}
const fmtTime=s=>`${Math.floor(s/60)}:${String(Math.floor(s%60)).padStart(2,'0')}`;
const escapeHtml=s=>s.replace(/[&<>]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;'}[c]));
// 목표 글 표시: 낱말 단위로 묶어서 줄이 바뀌어도 낱말이 끊어지지 않음
function targetHTML(text,pos){
  let left=pos, html='', curSet=false, word='';
  const cell=(ch,cls)=>`<span class="c ${cls}${ch===' '?' sp':''}">${ch===' '?'&nbsp;':escapeHtml(ch)}</span>`;
  const closeWord=()=>{ if(word){ html+=`<span class="w">${word}</span>`; word=''; } };
  for(const ch of text){
    const n=keysOf(ch).length; let cls;
    if(left>=n){ cls='done'; left-=n; } else if(!curSet){ cls='cur'; curSet=true; left=0; } else cls='todo';
    if(ch===' '){ closeWord(); html+=cell(ch,cls); } else word+=cell(ch,cls);
  }
  closeWord(); return html;
}

const P={
  items:[],idx:0,pos:0,keys:[],correct:0,errors:0,start:null,timer:null,active:false,
  reset(){
    this.stop(); this.items=makeItems(state.lang,state.level); this.idx=0; this.correct=0; this.errors=0; this.start=null; this.active=false;
    this.loadItem(); this.updateStats(); this.showStart();
  },
  showStart(){
    $('pOverlay').hidden=false;
    $('pOverlay').innerHTML=`<img src="assets/img/didi/cheer.webp" alt="" style="width:110px;height:auto;margin-bottom:-4px"><h2>${state.lang==='ko'?'한글':'영어'} ${LEVEL_NAME[state.level]}</h2><p>${LEVEL_DESC[state.level]}</p>
      <p>노란 키를 찾아서 눌러요. 틀리면 빨간불이 켜지고 넘어가지 않아요.</p>
      <div class="btn-row"><button class="big-btn" id="pStart">시작하기</button></div>
      <div class="hint-key">키보드 아무 키를 눌러도 시작돼요</div>`;
    $('pStart').onclick=()=>this.begin();
    setNext(null);
  },
  begin(){ $('pOverlay').hidden=true; this.active=true; this.render(); },
  loadItem(){
    const it=this.items[this.idx]; this.pos=0; this.keys=[...it].flatMap(keysOf);
    $('pCount').textContent=`${this.idx+1} / ${this.items.length}`;
    $('pLeft').textContent=this.items.length-this.idx;
    $('target').classList.toggle('big',state.level==='easy'); $('typed').classList.toggle('big',state.level==='easy');
    this.render();
  },
  render(){
    const it=this.items[this.idx];
    $('target').innerHTML=targetHTML(it,this.pos);
    $('typed').innerHTML=escapeHtml(renderPrefix(it,this.pos))+(this.active?'<span class="caret"></span>':'');
    $('pBar').style.width=(this.pos/this.keys.length*100)+'%';
    setNext(this.active?this.keys[this.pos]:null);
  },
  key(code,shift){
    if(!this.active){ if($('pOverlay').hidden===false&&$('pStart')){ this.begin(); return true; } return code==='Space'; }
    if(code==='Backspace'||code==='Enter'||code==='Tab') return true;
    const tok=tokenFor(code,shift); if(tok===null) return false;
    const want=this.keys[this.pos];
    if(tok===want){
      if(!this.start){ this.start=performance.now(); this.timer=setInterval(()=>this.updateStats(),250); }
      this.pos++; this.correct++; flashKey(KEY_FOR[want].code,'hit'); Sfx.ok();
      if(this.pos>=this.keys.length){ this.itemDone(); } else this.render();
    } else {
      this.errors++; flashKey(code,'miss'); Sfx.bad();
      $('pStage').classList.remove('shake'); void $('pStage').offsetWidth; $('pStage').classList.add('shake');
    }

  kpm(){ const m=this.elapsed()/60; return m>0.05?Math.round(this.correct/m):0; },

  },

  next(){ const c=this.lowest(this.cands()); return c?c.keys[this.buf.length]:null; },

/* 4. 기억 타자 */
GAMES.memory={
  setup(){
    const lang=state.lang, lv=state.level, W=lang==='ko'?WORDS_KO:WORDS_EN;
    let pool; if(lv==='easy') pool=W.filter(w=>lang==='ko'?w.length<=2:w.length<=4); else if(lv==='mid') pool=W; else { const s=shuffle(W); pool=s.slice(0,20).map((w,i)=>w+' '+s[(i+20)%s.length]); }
    this.items=shuffle(pool).slice(0,10); this.showFor={easy:3,mid:2.2,hard:3}[lv]; this.round=-1; this.total=this.items.length;
    G.area.innerHTML='<div class="mem" id="mem"></div>'; this.nextRound(true);
  },
  nextRound(first){
    this.round++; if(this.round>=this.total){ G.end(); return; }
    this.word=this.items[this.round]; this.keys=[...this.word].flatMap(keysOf); this.pos=0; this.errors=0; this.phase='show'; this.t=this.showFor; this.render();
  },
  render(){
    const m=$('mem'); if(!m) return;
    if(this.phase==='show'){ m.innerHTML=`<div class="note">잘 봐 두세요!</div><div class="show">${escapeHtml(this.word)}</div><div class="timer"><i id="memBar"></i></div>`; }
    else if(this.phase==='gap'){ m.innerHTML=`<div class="note">맞았어요!</div><div class="show" style="color:var(--mint)">${escapeHtml(this.word)}</div>`; }
    else {
      let left=this.pos, boxes='', curSet=false;
      for(const ch of this.word){
        const ks=keysOf(ch), n=ks.length, sp=ch===' '; let cls, content;
        if(left>=n){ cls='done'; content=sp?'':ch; left-=n; }
        else if(!curSet){ cls='cur'; content=sp?'':(left>0?compose(ks.slice(0,left)):'?'); curSet=true; left=0; }
        else { cls=''; content=sp?'':'?'; }
        boxes+=`<span class="box ${cls}${sp?' gap':''}">${escapeHtml(content)}</span>`;
      }
      m.innerHTML=`<div class="note">기억한 낱말을 쳐요 · ${this.round+1} / ${this.total}</div><div class="boxes">${boxes}</div>`;
    }
  },
  tick(dt){
    if(this.phase==='show'){ this.t-=dt; const b=$('memBar'); if(b) b.style.width=Math.max(0,this.t/this.showFor*100)+'%'; if(this.t<=0){ this.phase='type'; this.render(); } }
    else if(this.phase==='gap'){ this.t-=dt; if(this.t<=0) this.nextRound(); }
    else if(this.phase==='peek'){ this.t-=dt; const b=$('memBar'); if(b) b.style.width=Math.max(0,this.t/1.2*100)+'%'; if(this.t<=0){ this.phase='type'; this.render(); } }
  },
  next(){ return this.phase==='gap'?null:this.keys[this.pos]; },
  key(code,shift){
    if(this.phase==='gap') return true;
    if(code==='Backspace'||code==='Enter') return true;
    const tok=tokenFor(code,shift); if(tok===null) return false;
    if(tok===this.keys[this.pos]){
      if(this.phase!=='type'){ this.phase='type'; }
      this.pos++; G.right(code);
      if(this.pos>=this.keys.length){ G.hit(this.keys.length*10+(this.errors===0?20:0)); Sfx.done(); this.phase='gap'; this.t=0.7; this.render(); }
      else this.render();
    } else {
      this.errors++; G.wrong(code);
      if(this.errors%2===0&&this.phase==='type'){ this.phase='peek'; this.t=1.2; $('mem').innerHTML=`<div class="note">다시 한 번 보여줄게요</div><div class="show">${escapeHtml(this.word)}</div><div class="timer"><i id="memBar"></i></div>`; }
    }
    return true;
  },
  stat3(){ return G.count; }, stat4(){ return `${Math.min(this.round+1,this.total)} / ${this.total}`; },
  result(){ return [[G.score,'점수'],[G.count,'맞힌 문제'],[this.total,'전체 문제']]; }
};

/* 5. 번개 30초 */
GAMES.sprint={
  setup(){ G.time=30; this.newItem(); G.area.innerHTML='<div class="sprint"><div class="bolt" id="bolt">30</div><div class="target big" id="sTarget"></div><div class="typed big" id="sTyped"></div></div>'; this.render(); },
  newItem(){ let t; do{ t=pick(poolFor()); }while(t===this.text); this.text=t; this.keys=[...t].flatMap(keysOf); this.pos=0; },
  render(){ const tg=$('sTarget'); if(!tg) return; tg.innerHTML=targetHTML(this.text,this.pos); $('sTyped').innerHTML=escapeHtml(renderPrefix(this.text,this.pos))+'<span class="caret"></span>'; const isBig=state.level==='easy'; tg.classList.toggle('big',isBig); $('sTyped').classList.toggle('big',isBig); },
  tick(dt){ G.time-=dt; const b=$('bolt'); if(b){ b.textContent=Math.ceil(Math.max(0,G.time)); b.classList.toggle('low',G.time<=5); } if(G.time<=0){ G.time=0; G.end(); } },
  next(){ return this.keys[this.pos]; },
  key(code,shift){
    if(code==='Backspace'||code==='Enter') return true;
    const tok=tokenFor(code,shift); if(tok===null) return false;
    if(tok===this.keys[this.pos]){ this.pos++; G.right(code); if(this.pos>=this.keys.length){ G.hit(this.keys.length*10); Sfx.pop(); G.burstAt($('sTarget'),'var(--sun)'); this.newItem(); } this.render(); }
    else G.wrong(code);
    return true;
  },
  stat3(){ return G.count; }, stat4(){ return Math.ceil(G.time)+'초'; },
  result(){ return [[G.score,'점수'],[G.count,'맞힌 개수']]; }
};

/* 6. 괴물 물리치기 */
const MONSTER=(color)=>`<svg viewBox="0 0 120 106" aria-hidden="true"><path d="M26 22l10 18M94 22l-10 18" stroke="var(--ink)" stroke-width="4" stroke-linecap="round"/><path d="M20 60a40 34 0 0 1 80 0v26a12 12 0 0 1-12 12H32a12 12 0 0 1-12-12z" fill="${color}" stroke="var(--ink)" stroke-width="4" stroke-linejoin="round"/><circle cx="44" cy="58" r="9" fill="#fff"/><circle cx="76" cy="58" r="9" fill="#fff"/><circle cx="46" cy="59" r="4" fill="var(--ink)"/><circle cx="78" cy="59" r="4" fill="var(--ink)"/><path d="M42 78h36l-5 8H47z" fill="#fff" stroke="var(--ink)" stroke-width="3" stroke-linejoin="round"/></svg>`;
GAMES.boss={
  setup(){
    G.lives=3; this.stage=0; this.win=null; this.cfg={easy:[6,9],mid:[7,7],hard:[8,5]}[state.level]; // [괴물 체력(낱말 수), 공격까지 초]
    G.area.innerHTML=`<div class="boss"><div class="monster" id="monster"></div><div class="hpwrap"><span id="bName"></span><div class="hpbar"><i id="hpFill"></i></div></div><div class="gauge"><span>괴물 공격까지</span><div class="gbar"><i id="gaugeFill"></i></div></div><div class="target" id="bTarget"></div><div class="typed" id="bTyped"></div></div>`;
    this.nextMonster();
  },
  nextMonster(){
    this.stage++; this.hpMax=this.cfg[0]; this.hp=this.hpMax; this.gauge=0; this.gaugeTime=this.cfg[1]*Math.pow(0.8,this.stage-1);
    $('monster').innerHTML=MONSTER(['var(--grape)','var(--rose)','var(--primary)'][this.stage-1]); $('bName').textContent=`괴물 ${this.stage} / 3`;
    this.newWord(); this.render();
  },
  newWord(){ let t; do{ t=pick(poolFor()); }while(t===this.text); this.text=t; this.keys=[...t].flatMap(keysOf); this.pos=0; },
  render(){
    const tg=$('bTarget'); if(!tg) return;
    tg.innerHTML=targetHTML(this.text,this.pos); $('bTyped').innerHTML=escapeHtml(renderPrefix(this.text,this.pos))+'<span class="caret"></span>';
    $('hpFill').style.width=(this.hp/this.hpMax*100)+'%';
  },
  tick(dt){
    this.gauge+=dt/this.gaugeTime; const g=$('gaugeFill'); if(g) g.style.width=Math.min(100,this.gauge*100)+'%';
    if(this.gauge>=1){ this.gauge=0; const m=$('monster'); m.classList.remove('attack'); void m.offsetWidth; m.classList.add('attack'); G.loseLife(); if(G.lives<=0){ this.win=false; G.end(); } }
  },
  next(){ return this.keys[this.pos]; },
  key(code,shift){
    if(code==='Backspace'||code==='Enter') return true;
    const tok=tokenFor(code,shift); if(tok===null) return false;
    if(tok!==this.keys[this.pos]){ G.wrong(code); return true; }
    this.pos++; G.right(code);
    if(this.pos>=this.keys.length){
      this.hp--; G.hit(this.keys.length*10); Sfx.pop(); const m=$('monster'); m.classList.remove('hit'); void m.offsetWidth; m.classList.add('hit'); G.burstAt(m,'var(--accent)');
      if(this.hp<=0){ G.score+=100; Sfx.done(); if(this.stage>=3){ this.win=true; this.render(); G.end(); return true; } this.nextMonster(); return true; }
      this.newWord();
    }
    this.render(); return true;
  },
  stat3(){ return `${Math.min(this.stage,3)} / 3`; }, stat4(){ return heartsHTML(G.lives); },
  title(){ return this.win?'괴물을 모두 물리쳤어요!':'괴물에게 지고 말았어요'; },
  result(){ return [[G.score,'점수'],[G.count,'공격 횟수'],[`${this.win?3:this.stage-1} / 3`,'물리친 괴물']]; }
};

/* 게임 진행 관리 */
const G={
  id:store.get('game','rain'),game:null,running:false,over:true,score:0,combo:0,count:0,lives:3,time:0,raf:null,last:0,_hint:null,
  get area(){ return $('gArea'); },
  meta(){ return GAME_LIST.find(g=>g.id===this.id); },
  select(id){ this.id=id; store.set('game',id); document.querySelectorAll('.gcard').forEach(b=>b.classList.toggle('on',b.dataset.game===id)); this.reset(); },
  reset(){
    this.stopLoop(); if(this.game&&this.game.stop) this.game.stop();
    this.running=false; this.over=true; this.score=0; this.combo=0; this.count=0; this.lives=3; this.time=0; this._hint=null;
    this.game=GAMES[this.id]; const st=$('gStage'); st.className='stage g-'+this.id;
    $('gStat3Label').textContent=this.meta().stat3; $('gStat4Label').textContent=this.meta().stat4;
    this.game.setup(); this.paint(); setNext(null);
    const best=this.bestScore();
    $('gOverlay').hidden=false;
    $('gOverlay').innerHTML=`<div class="tier gicon-big">${GAME_ICON[this.id]}</div><h2>${this.meta().name}</h2><p>${this.meta().desc}.</p>${best?`<p>최고 기록 ${best.score}점${best.name?` · ${best.name} 학생`:''}</p>`:''}
      <div class="btn-row"><button class="big-btn" id="gStart">시작하기</button></div><div class="hint-key"><kbd>Enter</kbd> 로도 시작돼요</div>`;
    $('gStart').onclick=()=>this.begin();
  },
  bestScore(){ return records().filter(r=>r.mode==='game'&&(r.game||'rain')===this.id&&r.lang===state.lang&&r.level===state.level).reduce((m,r)=>!m||r.score>m.score?r:m,null); },
  begin(){ $('gOverlay').hidden=true; this.over=false; this.running=true; this.last=performance.now(); if(this.game.start) this.game.start(); this.raf=requestAnimationFrame(t=>this.tick(t)); this.hint(); },
  pause(){ if(!this.running||this.over) return; this.running=false; this.stopLoop(); $('gOverlay').hidden=false; $('gOverlay').innerHTML=`<h2>잠깐 멈춤</h2><div class="btn-row"><button class="big-btn" id="gResume">계속하기</button></div>`; $('gResume').onclick=()=>this.resume(); },
  resume(){ $('gOverlay').hidden=true; this.running=true; this.last=performance.now(); this.raf=requestAnimationFrame(t=>this.tick(t)); },
  stopLoop(){ if(this.raf){ cancelAnimationFrame(this.raf); this.raf=null; } },
  tick(ts){
    if(!this.running) return;
    const dt=Math.min(0.05,(ts-this.last)/1000); this.last=ts;
    if(this.game.tick) this.game.tick(dt);
    if(!this.running) return;
    this.paint(); this.hint(); this.raf=requestAnimationFrame(t=>this.tick(t));
  },
  hint(){ const ch=this.game.next?this.game.next():null; if(ch!==this._hint){ this._hint=ch; setNext(ch); } },
  key(code,shift){
    if(this.over){ if(code==='Enter'||code==='Space'){ if($('gStart')) this.begin(); else if($('gAgain')){ this.reset(); this.begin(); } return true; } return false; }
    if(!this.running){ if(code==='Enter'||code==='Space'){ this.resume(); return true; } return false; }
    const r=this.game.key(code,shift); this.paint(); this.hint(); return r;
  },
  right(code){ flashKey(code,'hit'); Sfx.ok(); },
  wrong(code){ this.combo=0; flashKey(code,'miss'); Sfx.bad(); const st=$('gStage'); st.classList.remove('shake'); void st.offsetWidth; st.classList.add('shake'); },
  hit(points){ this.combo++; this.count++; this.score+=points+Math.min(this.combo,10)*5; },
  loseLife(){ this.lives--; this.combo=0; Sfx.life(); const st=$('gStage'); st.classList.remove('shake'); void st.offsetWidth; st.classList.add('shake'); },
  burstAt(el,color){ if(!el) return; const st=$('gStage'), r=el.getBoundingClientRect(), sr=st.getBoundingClientRect(); burst(st,r.left-sr.left+r.width/2,r.top-sr.top+r.height/2,color); },
  paint(){
    $('gScore').textContent=this.game===GAMES.race?this.game.finalScore():this.score; $('gCombo').textContent=this.combo;
    $('gStat3').textContent=this.game.stat3(); $('gStat4').innerHTML=this.game.stat4();
  },
  end(){
    if(this.over) return;
    this.running=false; this.over=true; this.stopLoop(); if(this.game.stop) this.game.stop(); setNext(null);
    if(this.game===GAMES.race) this.score=this.game.finalScore();
    const all=records().filter(r=>r.mode==='game'&&(r.game||'rain')===this.id&&r.lang===state.lang&&r.level===state.level);
    const prev=this.bestScore(), last=all[0];
    const isBest=this.score>0&&prev&&this.score>prev.score;
    const worse=last&&this.score<last.score;
    let tier;
    if(isBest) tier='best'; else if(worse) tier='retry';
    else if(this.game.win!==undefined) tier=this.game.win?'great':'ok';
    else if(prev){ const r=this.score/Math.max(1,prev.score); tier=r>=0.8?'great':r>=0.5?'good':this.score>0?'ok':'low'; }
    else tier=this.count>=10?'great':this.count>=5?'good':this.count>=1?'ok':'low';
    const tags=[]; if(last&&this.score>last.score) tags.push('speed','growth'); if(['ok','low','retry'].includes(tier)) tags.push('retry'); if(!tags.length) tags.push('growth','acc');
    const pr=praise(tier,tags);
    if(this.game.win!==undefined){ if(this.game.win) Sfx.finish(); else Sfx.over(); } else if(this.score>0) Sfx.finish(); else Sfx.over();
    saveRecord({t:Date.now(),name:playerName(),lang:state.lang,level:state.level,mode:'game',game:this.id,score:this.score,count:this.count,detail:this.game.result().map(([v,l])=>`${l} ${v}`).join(' · ')});
    this.paint();
    $('gOverlay').hidden=false;
    $('gOverlay').innerHTML=`${praiseHTML(pr)}${this.game.title?`<p>${this.game.title()}</p>`:''}
      <div class="result-grid">${this.game.result().map(([v,l])=>`<div><b>${v}</b><span>${l}</span></div>`).join('')}</div>
      <div class="btn-row"><button class="big-btn" id="gAgain">다시 하기</button><button class="big-btn alt" id="gRec">기록 보기</button></div>`;
    $('gAgain').onclick=()=>{ this.reset(); this.begin(); };
    $('gRec').onclick=()=>setTab('records');
  }
};
$('gameList').innerHTML=GAME_LIST.map(g=>`<button class="gcard${g.id===G.id?' on':''}" data-game="${g.id}" title="${g.name}"><span class="gicon">${GAME_ICON[g.id]}</span><b>${g.name}</b><span class="gdesc">${g.desc}</span></button>`).join('');
document.querySelectorAll('.gcard').forEach(b=>b.addEventListener('click',()=>G.select(b.dataset.game)));
window.addEventListener('resize',()=>{ if(G.game===GAMES.race&&!G.over) G.game.render(); });
document.addEventListener('visibilitychange',()=>{ if(document.hidden) G.pause(); });

/* ===================== 기록 ===================== */
function records(){ return store.get('records',[]); }
function saveRecord(r){ const list=records(); list.unshift(r); store.set('records',list.slice(0,200)); try{ if(window.parent!==window) window.parent.postMessage({dnakids:'typing',record:r},location.origin); }catch(e){} }
function renderRecords(){
  const list=records();
  const bestOf=(f,key)=>list.filter(f).reduce((m,r)=>!m||r[key]>m[key]?r:m,null);
  const bk=bestOf(r=>r.mode==='practice'&&r.lang==='ko','kpm'), be=bestOf(r=>r.mode==='practice'&&r.lang==='en','kpm'), bg=bestOf(r=>r.mode==='game','score');
  $('bests').innerHTML=`
    <div class="best"><span>한글 최고 타수</span><b>${bk?bk.kpm:'-'}</b><small>${bk?`${bk.name?bk.name+' 학생 · ':''}${LEVEL_NAME[bk.level]} · 정확도 ${bk.acc}%`:'아직 기록이 없어요'}</small></div>
    <div class="best"><span>영어 최고 타수</span><b>${be?be.kpm:'-'}</b><small>${be?`${be.name?be.name+' 학생 · ':''}${LEVEL_NAME[be.level]} · 정확도 ${be.acc}%`:'아직 기록이 없어요'}</small></div>
    <div class="best"><span>게임 최고 점수</span><b>${bg?bg.score:'-'}</b><small>${bg?`${bg.name?bg.name+' 학생 · ':''}${GAME_NAME[bg.game||'rain']} · ${bg.lang==='ko'?'한글':'영어'} ${LEVEL_NAME[bg.level]}`:'아직 기록이 없어요'}</small></div>`;
  if(!list.length){ $('recWrap').innerHTML='<div class="empty">연습이나 게임을 끝까지 하면 여기에 기록이 쌓여요.</div>'; return; }
  const rows=list.slice(0,40).map(r=>{
    const d=new Date(r.t), ds=`${d.getMonth()+1}/${d.getDate()} ${String(d.getHours()).padStart(2,'0')}:${String(d.getMinutes()).padStart(2,'0')}`;
    const res=r.mode==='practice'?`타수 ${r.kpm} · 정확도 ${r.acc}% · ${fmtTime(r.secs)}`:(r.detail||`${r.score}점`);
    return `<tr><td>${ds}</td><td>${r.name||'-'}</td><td><span class="pill ${r.lang}">${r.lang==='ko'?'한글':'영어'}</span></td><td>${LEVEL_NAME[r.level]}</td><td>${r.mode==='practice'?'연습':`<span class="pill game">${GAME_NAME[r.game||'rain']}</span>`}</td><td class="num">${res}</td></tr>`;
  }).join('');
  $('recWrap').innerHTML=`<table><thead><tr><th>날짜</th><th>이름</th><th>글자</th><th>단계</th><th>모드</th><th>결과</th></tr></thead><tbody>${rows}</tbody></table>`;
}
let clearArmed=false;
$('clearBtn').addEventListener('click',()=>{
  if(!clearArmed){ clearArmed=true; $('clearBtn').textContent='정말 지울까요? 한 번 더 누르면 지워져요'; setTimeout(()=>{clearArmed=false;$('clearBtn').textContent='기록 모두 지우기';},4000); return; }
  store.set('records',[]); clearArmed=false; $('clearBtn').textContent='기록 모두 지우기'; renderRecords();
});

/* ===================== 화면 전환 ===================== */
function setTab(tab){
  state.tab=tab;
  document.querySelectorAll('.tabs button').forEach(b=>b.classList.toggle('on',b.dataset.tab===tab));
  ['practice','game','records'].forEach(t=>$('tab-'+t).hidden=t!==tab);
  $('kb').parentElement.style.display=tab==='records'?'none':'';
  if(tab==='records'){ renderRecords(); G.pause(); setNext(null); }
  if(tab==='practice'){ G.pause(); P.render(); }
  if(tab==='game'){ if(G.over) G.reset(); }
}
document.querySelectorAll('.tabs button').forEach(b=>b.addEventListener('click',()=>setTab(b.dataset.tab)));
function setLang(l){ state.lang=l; store.set('lang',l); document.querySelectorAll('#langSeg button').forEach(b=>b.classList.toggle('on',b.dataset.lang===l)); paintKb(); P.reset(); G.reset(); if(state.tab==='records') setNext(null); }
function setLevel(l){ state.level=l; store.set('level',l); document.querySelectorAll('#levelSeg button').forEach(b=>b.classList.toggle('on',b.dataset.level===l)); P.reset(); G.reset(); if(state.tab==='records') setNext(null); }
document.querySelectorAll('#langSeg button').forEach(b=>b.addEventListener('click',()=>setLang(b.dataset.lang)));
document.querySelectorAll('#levelSeg button').forEach(b=>b.addEventListener('click',()=>setLevel(b.dataset.level)));
$('soundBtn').addEventListener('click',()=>{ Sfx.on=!Sfx.on; store.set('sound',Sfx.on); $('soundBtn').setAttribute('aria-pressed',Sfx.on); $('soundBtn').textContent=Sfx.on?'소리 켬':'소리 끔'; if(Sfx.on){Sfx.ensure();Sfx.ok();} });
$('soundBtn').setAttribute('aria-pressed',Sfx.on); $('soundBtn').textContent=Sfx.on?'소리 켬':'소리 끔';

// 처음 화면
document.querySelectorAll('#langSeg button').forEach(b=>b.classList.toggle('on',b.dataset.lang===state.lang));
document.querySelectorAll('#levelSeg button').forEach(b=>b.classList.toggle('on',b.dataset.level===state.level));
paintKb(); P.reset(); G.reset(); setTab('practice');

/* ===================== 전체화면 & 화면 맞춤 ===================== */
const inFrame = window.parent !== window;
let fakeFs = false, parentFs = false;
const realFs = () => !!(document.fullscreenElement || document.webkitFullscreenElement);
function fitApp(){
  const a=document.querySelector('.app'); if(!a) return;
  a.style.zoom='';
  if(state.tab==='records'){ return; }
  const h=a.scrollHeight, w=a.scrollWidth;
  const z=Math.min(1, window.innerHeight/h, window.innerWidth/w);
  if(z<0.995) a.style.zoom=Math.max(z,0.45).toFixed(3);
}
function applyFs(){
  const on = realFs() || fakeFs || parentFs;
  document.body.classList.toggle('fs', on);
  $('fsBtn').textContent = on ? '전체화면 끝내기' : '전체화면';
  $('fsBtn').setAttribute('aria-pressed', on);
  requestAnimationFrame(()=>requestAnimationFrame(fitApp));
}
const toParent = m => { try{ window.parent.postMessage(Object.assign({dnakids:'fsctl'},m), location.origin); }catch(e){} };
window.addEventListener('message', e=>{ if(e.origin===location.origin && e.data && e.data.dnakids==='setfs'){ parentFs=!!e.data.on; applyFs(); } });
try{ const ql=new URLSearchParams(location.search).get('lang'); if(ql==='en'||ql==='ko') setLang(ql); }catch(e){}
$('fsBtn').addEventListener('click', async ()=>{
  $('fsBtn').blur();
  if(inFrame){ toParent({on: !parentFs}); return; }
  if(realFs() || fakeFs){
    if(fakeFs){ fakeFs=false; applyFs(); return; }
    try{ await (document.exitFullscreen ? document.exitFullscreen() : document.webkitExitFullscreen()); }catch(e){}
    return;
  }
  const el=document.documentElement;
  try{
    if(el.requestFullscreen) await el.requestFullscreen();
    else if(el.webkitRequestFullscreen) el.webkitRequestFullscreen();
    else throw new Error('no');
  }catch(e){ fakeFs=true; applyFs(); }
});
document.addEventListener('fullscreenchange', applyFs);
document.addEventListener('webkitfullscreenchange', applyFs);
document.addEventListener('keydown', e=>{ if(e.key==='Escape'){ if(fakeFs){ fakeFs=false; applyFs(); } else if(parentFs){ toParent({on:false}); } } });
window.addEventListener('resize', ()=>requestAnimationFrame(fitApp));
document.querySelectorAll('.tabs button, #langSeg button, #levelSeg button').forEach(b=>b.addEventListener('click',()=>requestAnimationFrame(()=>requestAnimationFrame(fitApp))));
document.addEventListener('click', e=>{ if(e.target.closest('#gameList')) requestAnimationFrame(()=>requestAnimationFrame(fitApp)); });
window.addEventListener('load', fitApp); setTimeout(fitApp, 300);
</script>
