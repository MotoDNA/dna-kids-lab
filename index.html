<style>
:root{--ink:#222;--sub:#5f6368;--line:#e6e6e6;--accent:#1f6b52;--accent-soft:#e8f2ee;--note:#fff8e1;--bad:#b3261e;--good:#1f6b52}
*{box-sizing:border-box}
body{margin:0;background:#f6f1e6 url(assets/img/paper_bg.jpg) repeat;background-size:384px;color:var(--ink);font-family:'Noto Sans KR','Apple SD Gothic Neo','Malgun Gothic',sans-serif;font-size:17px;line-height:1.75;-webkit-font-smoothing:antialiased;word-break:keep-all;overflow-wrap:break-word;line-break:strict}
a{color:var(--accent)}
img{max-width:100%;display:block}
button,select,input{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.w{max-width:880px;margin:0 auto;padding-inline:20px}
.narrow{max-width:720px}
header{border-bottom:1px solid var(--line)}
header .w{display:flex;flex-wrap:wrap;align-items:center;justify-content:space-between;gap:8px 20px;padding-block:14px}
.brand{font-weight:700;font-size:19px;color:var(--ink);text-decoration:none}
.brand small{font-weight:400;color:var(--sub);font-size:14px;margin-left:6px}
nav{display:flex;flex-wrap:wrap;gap:2px 16px}
nav a{color:var(--ink);text-decoration:none;font-size:15px;padding:4px 0}
nav a.on{text-decoration:underline;text-underline-offset:6px;text-decoration-thickness:2px}
.acct{width:100%;display:flex;justify-content:flex-end;align-items:center;gap:10px;font-size:14px;color:var(--sub);min-height:28px}
.acct.parent{background:#fff4e5;border-radius:4px;padding:4px 10px;color:#7a4b00}
.lnk{background:none;border:0;padding:4px 2px;color:var(--accent);text-decoration:underline;cursor:pointer;font-size:14px}
main{padding-block:32px 80px;min-height:60vh}
h1{font-size:28px;line-height:1.35;margin:0 0 10px;letter-spacing:-.3px}
h2{font-size:21px;margin:44px 0 14px;letter-spacing:-.2px}
h3{font-size:17px;margin:0}
p{margin:0 0 12px}
.sub{color:var(--sub)}
.intro{max-width:36em;margin-bottom:24px}
.f{background:none;border:0;padding:8px 8px;min-height:40px;cursor:pointer;border-radius:4px}
.f[aria-pressed="true"]{font-weight:700;text-decoration:underline;text-underline-offset:5px;text-decoration-thickness:2px}
.f:hover{background:#f4f4f4}
.filters{display:flex;flex-wrap:wrap;gap:10px 28px;align-items:center;padding:12px 0;border-top:1px solid var(--ink);border-bottom:1px solid var(--line);font-size:15px}
.filters .grp{display:flex;flex-wrap:wrap;align-items:center;gap:2px 4px}
.filters .lab{color:var(--sub);margin-right:6px}
select,input[type=text],input[type=password]{border:1px solid #bbb;border-radius:4px;padding:8px 10px;min-height:44px;background:#fff;width:100%}
.btn{background:var(--accent);color:#fff;border:0;border-radius:4px;padding:10px 18px;min-height:44px;cursor:pointer;font-weight:500}
.btn.ghost{background:#fff;color:var(--accent);border:1px solid var(--accent)}
.btn:disabled{opacity:.5;cursor:default}
.count{font-size:14px;color:var(--sub);margin:14px 0 4px}
ul.list{list-style:none;margin:0;padding:0}
ul.list li{border-bottom:1px solid var(--line)}
ul.list a{display:grid;grid-template-columns:120px 1fr;gap:18px;padding:18px 0;color:var(--ink);text-decoration:none;align-items:start}
ul.list img{width:120px;height:90px;object-fit:cover;border-radius:3px;background:#f2f2f2}
ul.list .t{font-weight:700;font-size:18px;line-height:1.4}
ul.list a:hover .t{text-decoration:underline}
.meta{font-size:14px;color:var(--sub)}
ul.list p{margin:4px 0 0;font-size:15px;color:#444}
.units{list-style:none;margin:0;padding:0;counter-reset:u}
.units li{border-bottom:1px solid var(--line)}
.units a{display:grid;grid-template-columns:34px 1fr auto;gap:12px;align-items:baseline;padding:14px 0;color:var(--ink);text-decoration:none}
.units a:hover .t{text-decoration:underline}
.units .n{color:var(--sub);font-size:15px;font-variant-numeric:tabular-nums}
.units .t{font-weight:700}
.units .topic{display:block;font-size:14px;color:var(--sub);font-weight:400}
.done{font-size:13px;color:var(--good);white-space:nowrap}
.empty{padding:40px 0;color:var(--sub)}
.back{font-size:15px;display:inline-block;margin-bottom:20px;text-decoration:none}
.hero{width:100%;aspect-ratio:3/2;object-fit:cover;border-radius:3px;margin:22px 0 8px;background:#f2f2f2}
.hero.doc{aspect-ratio:auto;max-width:360px;border:1px solid var(--line)}
table{width:100%;border-collapse:collapse;font-size:16px}
th,td{text-align:left;padding:10px 8px;border-bottom:1px solid var(--line);vertical-align:top}
th{font-size:14px;color:var(--sub);font-weight:500;border-bottom:1px solid var(--ink)}
td:first-child{font-weight:500;padding-right:16px}
.tbl{overflow-x:auto}
.kit{font-size:13px;color:var(--accent);margin-left:6px;white-space:nowrap}
ol.steps{margin:0;padding-left:1.4em}
ol.steps li{margin-bottom:26px;padding-left:4px}

.sayrow{display:flex;flex-wrap:wrap;gap:6px;margin-top:8px}

.page-in .tbl table{width:100%;table-layout:fixed}.page-in .tbl td{overflow-wrap:anywhere}.reader.ja .tbl td:first-child,.reader.zh .tbl td:first-child{word-break:normal}

.caution{font-size:15px;color:#8a3b12;margin-top:4px}
.note{background:var(--note);padding:14px 18px;border-radius:4px;margin:16px 0;font-size:16px}

.dl{display:flex;flex-wrap:wrap;gap:8px 16px;align-items:baseline;border:1px solid var(--line);border-radius:4px;padding:16px 18px;margin:24px 0}
.dl a{font-weight:700}
.dl span{font-size:15px;color:var(--sub)}
ul.plain{margin:0;padding-left:1.2em}
ul.plain li{margin-bottom:6px}
.facts{margin-top:48px;border-top:1px solid var(--ink);padding-top:16px;font-size:15px;display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:10px 24px}
.facts b{display:block;font-weight:500;color:var(--sub);font-size:13px}
dl.kw{display:grid;grid-template-columns:max-content 1fr;gap:6px 18px;margin:0}
dl.kw dt{font-weight:700}
dl.kw dd{margin:0}
.fr{display:inline-flex;flex-direction:column;align-items:center;vertical-align:middle;font-size:.9em;line-height:1.08;margin:0 .12em;font-variant-numeric:tabular-nums}
.fr .fn{border-bottom:.09em solid currentColor;padding:0 .2em .04em}
.fr .fd{padding:.04em .2em 0}
.ch button .fr,.pg-q .fr{font-size:1.05em;margin:2px .12em}
canvas.fx{position:fixed;inset:0;width:100vw;height:100vh;pointer-events:none;z-index:9999}
@keyframes pop{0%{transform:scale(1)}35%{transform:scale(1.08)}70%{transform:scale(.98)}100%{transform:scale(1)}}
@keyframes shake{0%,100%{transform:translateX(0)}20%{transform:translateX(-7px)}40%{transform:translateX(6px)}60%{transform:translateX(-4px)}80%{transform:translateX(3px)}}
.pop{animation:pop .45s ease-out}
.ch button.shake{animation:shake .4s ease-in-out}
.fb b.ok{display:inline-block;animation:pop .5s ease-out}
.sndbtn{margin-left:10px;background:none;border:1px solid #ccc;border-radius:14px;padding:2px 10px;font-size:13px;cursor:pointer;color:inherit}

.say{background:none;border:1px solid #ccc;border-radius:4px;padding:2px 8px;font-size:13px;cursor:pointer;margin-left:8px;white-space:nowrap}
.quiz ol{padding-left:1.3em;margin:0}
.quiz u{text-decoration:underline;text-decoration-thickness:2px;text-underline-offset:4px;font-weight:700}
.quiz li.q{margin-bottom:26px}
.ch{display:flex;flex-direction:column;gap:6px;margin-top:8px}
.ch button{text-align:left;background:#fff;border:1px solid #ccc;border-radius:4px;padding:10px 14px;min-height:44px;cursor:pointer}
.ch button:hover:not(:disabled){border-color:var(--accent)}
.ch button.right{border-color:var(--good);background:var(--accent-soft);font-weight:500}
.ch button.wrong{border-color:var(--bad);background:#fbeceb}
.ch button:disabled{cursor:default}
.fb{margin-top:8px;font-size:15px}
.fb.has-didi{display:flex;gap:12px;align-items:flex-start}.fb .didi{width:72px;height:auto;flex:none;margin-top:-6px}.fb.has-didi>div{flex:1;min-width:0}
.home-top{display:flex;align-items:flex-end;justify-content:space-between;gap:16px}.home-top .didi{width:120px;height:auto;flex:none;margin:-8px 0 8px}
.score.has-didi{display:flex;gap:12px;align-items:center}.score .didi{width:84px;height:auto;flex:none}
.narr .didi-i{width:24px;height:24px;object-fit:contain;vertical-align:-6px;margin-right:2px}
@media (max-width:560px){.home-top .didi{width:84px}.fb .didi{width:56px}}
.fb b.ok{color:var(--good)} .fb b.no{color:var(--bad)}
.score{border:1px solid var(--accent);border-radius:4px;padding:14px 18px;margin-top:10px}
.sum{border-top:1px solid var(--ink);margin-top:44px;padding-top:6px}
details{border:1px solid var(--line);border-radius:4px;padding:10px 16px;margin-top:20px}
summary{cursor:pointer;font-weight:500}
.try{display:grid;grid-template-columns:140px 1fr;gap:16px;border:1px solid var(--line);border-radius:4px;padding:14px;text-decoration:none;color:var(--ink);margin-top:8px}
.try img{width:140px;height:105px;object-fit:cover;border-radius:3px;background:#f2f2f2}
.try:hover .t{text-decoration:underline}
.form{max-width:420px}
.form label{display:block;margin:16px 0 4px;font-weight:500;font-size:15px}
.form .hint{font-size:13px;color:var(--sub);margin-top:4px}
.err{color:var(--bad);font-size:15px;margin-top:12px}
.stat{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:12px;margin:18px 0}
.stat div{border:1px solid var(--line);border-radius:4px;padding:12px 14px}
.stat b{display:block;font-size:24px}
.stat span{font-size:13px;color:var(--sub)}
.bars{display:flex;align-items:flex-end;gap:6px;height:120px;border-bottom:1px solid var(--ink);margin-top:10px}
.bars div{flex:1;background:var(--accent);border-radius:2px 2px 0 0;min-height:2px;position:relative}
.bars-l{display:flex;gap:6px;font-size:12px;color:var(--sub)}
.bars-l span{flex:1;text-align:center}
.modal{position:fixed;inset:0;background:rgba(0,0,0,.35);display:flex;align-items:center;justify-content:center;padding:20px;z-index:10}
.modal .box{background:#fff;border-radius:6px;padding:22px;max-width:360px;width:100%}
.pin{letter-spacing:.4em;font-size:22px;text-align:center}
iframe.typing{width:100%;height:max(560px,calc(100vh - 150px));border:1px solid var(--line);border-radius:4px;display:block}
iframe.typing.fs{position:fixed;inset:0;width:100vw;height:100vh;height:100dvh;border:0;border-radius:0;z-index:50;background:#fff}
body.nofs-scroll{overflow:hidden}
.reader{max-width:860px;margin:0 auto}
.reader-top{display:flex;justify-content:space-between;align-items:baseline;gap:12px;margin-bottom:12px}
.book{position:relative;height:clamp(440px,calc(100vh - 250px),720px);perspective:2000px}
.page{position:absolute;inset:0;background:#fffdf8 url(assets/img/paper_page.jpg) repeat;background-size:320px;border:1px solid #e3ded2;border-radius:4px 10px 10px 4px;box-shadow:inset 14px 0 18px -14px rgba(0,0,0,.18),0 10px 26px rgba(30,30,20,.10);transform-origin:left center;transition:transform .6s cubic-bezier(.3,.7,.3,1),opacity 0s;backface-visibility:hidden;display:flex;flex-direction:column}
.page.now{transform:rotateY(0);opacity:1;z-index:3}
.page.future{transform:rotateY(0);opacity:0;z-index:1;transition:opacity .1s linear .5s}
.page.past{transform:rotateY(-100deg);opacity:0;z-index:4;pointer-events:none;transition:transform .6s cubic-bezier(.3,.7,.3,1),opacity .15s linear .45s}
.page-in{flex:1;overflow:auto;padding:30px 40px 18px}
.folio{text-align:center;font-size:13px;color:#9a9486;padding:6px 0 10px}
.pg-cover{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1.1fr);gap:28px;align-items:start}
.pg-cover:not(:has(img)){grid-template-columns:1fr}
.pg-cover img{width:100%;aspect-ratio:3/2;object-fit:cover;border-radius:4px;background:#eee}
.pg-title{font-size:30px;line-height:1.35;margin:6px 0 12px}
.pg-lead{font-size:18px}
.pg-toc{border-top:1px solid #e3ded2;margin-top:16px;padding-top:12px;font-size:16px}
.pg-toc ol{margin:6px 0 0;padding-left:1.3em}
.pg-kicker{font-size:14px;color:var(--accent);font-weight:700;letter-spacing:.02em}
.pg-h{font-size:26px;margin:4px 0 16px}
.page-in p{font-size:19px;line-height:1.85}
.page-in .ex{font-size:18px}
.pg-q{font-size:21px;font-weight:500;line-height:1.6}
.page-in .ch button{font-size:18px}
dl.kw.big{font-size:19px;gap:12px 22px}
ul.plain.big{font-size:19px} ul.plain.big li{margin-bottom:10px}
.edge{position:absolute;top:50%;z-index:6;width:40px;height:40px;margin-top:-20px;border-radius:50%;border:1px solid #d8d2c4;background:rgba(255,255,255,.92);box-shadow:0 2px 8px rgba(0,0,0,.12);color:var(--accent);font-size:28px;line-height:34px;text-align:center;padding:0;cursor:pointer;font-family:Georgia,serif}
.edge.l{left:-20px}.edge.r{right:-20px}
.edge[hidden]{display:none}
.edge:hover{background:#fff;border-color:var(--accent)}
@keyframes nudge{0%,100%{transform:translateX(0)}50%{transform:translateX(6px)}}
.edge.r.nudge{animation:nudge 1.2s ease-in-out 3}
.swipe-hint{position:absolute;left:50%;bottom:44px;transform:translateX(-50%);z-index:7;background:rgba(30,60,45,.88);color:#fff;font-size:15px;padding:8px 16px;border-radius:20px;white-space:nowrap;opacity:0;pointer-events:none;transition:opacity .3s}
.swipe-hint.on{opacity:1}
.swipe-hint .ar{display:inline-block;font-weight:700;animation:nudge 1s ease-in-out infinite}
.swipe-hint .ar:first-child{animation-direction:reverse}
@media (max-width:640px){.edge{width:34px;height:34px;margin-top:-17px;font-size:24px;line-height:29px}.edge.l{left:-12px}.edge.r{right:-12px}}
@media (prefers-reduced-motion:reduce){.edge.r.nudge,.swipe-hint .ar{animation:none}}
.wb{display:block;margin:18px 0 6px;padding:12px 16px;border:1.5px solid var(--accent);border-radius:8px;background:rgba(255,255,255,.7);color:var(--ink);text-decoration:none}
.wb b{display:block;color:var(--accent);font-size:17px}.wb span{font-size:14px;color:var(--sub)}
.wb:hover{background:#fff}
.narr{float:right;margin:0 0 8px 12px;background:#fff;border:1.5px solid var(--accent);color:var(--accent);border-radius:18px;padding:5px 14px;font-size:15px;cursor:pointer;font-weight:700}
.narr.playing{background:var(--accent);color:#fff}
.b12 .page-in p{font-size:22px;line-height:1.9}.b12 .pg-h{font-size:28px}.b12 .pg-q{font-size:24px}.b12 .page-in .ch button{font-size:22px}.b12 .page-in .ex{font-size:21px}.b12 dl.kw.big{font-size:21px}.b12 .tbl td{font-size:20px}
@media (max-width:640px){.b12 .page-in p{font-size:19px}.b12 .pg-h{font-size:23px}.b12 .pg-q{font-size:20px}.b12 .page-in .ch button{font-size:19px}.narr{font-size:14px;padding:4px 11px}}
.reader.zh .page-in{font-family:'Noto Sans SC','Noto Sans KR',sans-serif}.reader.ja .page-in{font-family:'Noto Sans JP','Noto Sans KR',sans-serif}
@media (max-width:640px){.reader-top .tp{display:none}.reader-top .sndbtn{margin-left:4px;font-size:12px;padding:2px 8px}}
#toast{position:fixed;left:50%;bottom:28px;transform:translateX(-50%) translateY(20px);background:#1f3d2e;color:#fff;padding:10px 18px;border-radius:22px;font-size:15px;opacity:0;transition:.25s;z-index:9999;pointer-events:none;max-width:90vw}
#toast.on{opacity:1;transform:translateX(-50%) translateY(0)}
.agree{display:flex;gap:8px;align-items:flex-start;font-size:14px;line-height:1.5;margin-top:14px;font-weight:400}.agree input{margin-top:4px;width:18px;height:18px;flex:none}
.flinks{margin-bottom:6px}.flinks a{color:inherit}
.book-nav{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-top:14px}

/* 디디 결과 축하 애니메이션 */
.dfx{position:fixed;inset:0;z-index:9000;display:flex;align-items:center;justify-content:center;background:rgba(30,40,35,.45);opacity:0;transition:opacity .25s;padding:16px}
.dfx.on{opacity:1}
.dfx-card{position:relative;background:#fffdf7;border-radius:22px;box-shadow:0 20px 60px rgba(0,0,0,.25);width:min(420px,100%);padding:26px 22px 22px;text-align:center;overflow:hidden;transform:scale(.8);transition:transform .35s cubic-bezier(.2,1.6,.4,1)}

const FRAC_RE = /(^|[^\d/.])(\d{1,3})\/(\d{1,3})(?![\d/])/g;
function fracify(root) {
  if (!root) return;
  const w = document.createTreeWalker(root, NodeFilter.SHOW_TEXT, { acceptNode: n => (/\d\/\d/.test(n.nodeValue) && !n.parentElement.closest('.fr,script,style,textarea,.say,a[href^="http"]')) ? 1 : 2 });
  const nodes = []; while (w.nextNode()) nodes.push(w.currentNode);
  nodes.forEach(n => {
    const span = document.createElement('span');
    span.innerHTML = esc(n.nodeValue).replace(FRAC_RE, (m, pre, a, b) => `${pre}<span class="fr" role="math" aria-label="${b}분의 ${a}"><span class="fn">${a}</span><span class="fd">${b}</span></span>`);
    n.replaceWith(...span.childNodes);

}

      g.gain.exponentialRampToValueAtTime(0.0001, t0 + at + dur);

    };

    else if (kind === 'wrong') { tone(392, 0, 0.18, 'sine', 0.16); tone(330, 0.15, 0.3, 'sine', 0.14); }
    else if (kind === 'flip') {

      const len = 0.32, buf = actx.createBuffer(1, actx.sampleRate * len, actx.sampleRate), d = buf.getChannelData(0);
      for (let i = 0; i < d.length; i++) d[i] = (Math.random() * 2 - 1) * (0.6 + 0.4 * Math.random());

      bp.frequency.setValueAtTime(2600, t0); bp.frequency.exponentialRampToValueAtTime(900, t0 + len);

      const g = actx.createGain();

  } catch (e) {}
}

let typingOverlay = false;
const tf = () => document.getElementById('typingFrame');
const fsEl = () => document.fullscreenElement || document.webkitFullscreenElement;
function tellTyping(on) { const f = tf(); if (f && f.contentWindow) f.contentWindow.postMessage({ dnakids: 'setfs', on }, location.origin); }
async function typingFs(on) {
  const f = tf(); if (!f) return;
  if (on) {
    try {
      if (f.requestFullscreen) await f.requestFullscreen();
      else if (f.webkitRequestFullscreen) f.webkitRequestFullscreen();
      else throw new Error('no');
    } catch (e) { typingOverlay = true; f.classList.add('fs'); document.body.classList.add('nofs-scroll'); }
    tellTyping(true); setTimeout(() => f.focus(), 100);
  } else {
    if (fsEl()) { try { await (document.exitFullscreen ? document.exitFullscreen() : document.webkitExitFullscreen()); } catch (e) {} }
    typingOverlay = false; f.classList.remove('fs'); document.body.classList.remove('nofs-scroll');
    tellTyping(false);
  }
}
const onFsChange = () => { const f = tf(); if (!f) return; if (!fsEl() && !typingOverlay) tellTyping(false); else if (fsEl() === f) tellTyping(true); };
document.addEventListener('fullscreenchange', onFsChange);
document.addEventListener('webkitfullscreenchange', onFsChange);
window.addEventListener('message', e => {
  if (e.origin === location.origin && e.data && e.data.dnakids === 'fsctl') { typingFs(!!e.data.on); return; }
  if (e.origin !== location.origin || !e.data || e.data.dnakids !== 'typing') return;
  const r = e.data.record || {};
  const lang = r.lang === 'en' ? '영어' : '한글';
  const title = r.mode === 'practice' ? `${lang} 타자 연습` : `${lang} 타자 게임`;

});
