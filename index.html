<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>DNA Kids Lab</title>
<meta name="description" content="집에 있는 재료로 해 보는 초등 3~6학년 과학·수학·영어 활동과 인쇄용 도안.">
<meta property="og:title" content="DNA Kids Lab (디엔에이 키즈랩)">
<meta property="og:description" content="집에 있는 재료로 해 보는 초등 과학·수학·영어 활동">
<meta property="og:image" content="assets/img/e1_done.jpg">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;500;700&display=swap">
<style>
:root{--ink:#222;--sub:#5f6368;--line:#e6e6e6;--accent:#1f6b52;--note:#fff8e1}
*{box-sizing:border-box}
body{margin:0;background:#fff;color:var(--ink);font-family:'Noto Sans KR','Apple SD Gothic Neo','Malgun Gothic',sans-serif;font-size:17px;line-height:1.75;-webkit-font-smoothing:antialiased}
a{color:var(--accent)}
img{max-width:100%;display:block}
button,select{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.w{max-width:880px;margin:0 auto;padding-inline:20px}
.narrow{max-width:720px}
header{border-bottom:1px solid var(--line)}
header .w{display:flex;flex-wrap:wrap;align-items:baseline;justify-content:space-between;gap:6px 20px;padding-block:18px}
.brand{font-weight:700;font-size:19px;color:var(--ink);text-decoration:none}
.brand small{font-weight:400;color:var(--sub);font-size:14px;margin-left:6px}
nav a{color:var(--ink);text-decoration:none;margin-left:18px;font-size:15px}
nav a:first-child{margin-left:0}
nav a.on{text-decoration:underline;text-underline-offset:6px;text-decoration-thickness:2px}
main{padding-block:36px 80px;min-height:60vh}
h1{font-size:28px;line-height:1.35;margin:0 0 10px;letter-spacing:-.3px}
h2{font-size:21px;margin:48px 0 14px;letter-spacing:-.2px}
h3{font-size:17px;margin:0}
p{margin:0 0 12px}
.sub{color:var(--sub)}
.intro{max-width:36em;margin-bottom:28px}
.filters{display:flex;flex-wrap:wrap;gap:10px 28px;align-items:center;padding:14px 0;border-top:1px solid var(--ink);border-bottom:1px solid var(--line);font-size:15px}
.filters .grp{display:flex;flex-wrap:wrap;align-items:center;gap:2px 4px}
.filters .lab{color:var(--sub);margin-right:6px}
.f{background:none;border:0;padding:8px 8px;min-height:40px;cursor:pointer;border-radius:4px}
.f[aria-pressed="true"]{font-weight:700;text-decoration:underline;text-underline-offset:5px;text-decoration-thickness:2px}
.f:hover{background:#f4f4f4}
select{border:1px solid #ccc;border-radius:4px;padding:6px 8px;min-height:40px;background:#fff}
.count{font-size:14px;color:var(--sub);margin:14px 0 4px}
ul.list{list-style:none;margin:0;padding:0}
ul.list li{border-bottom:1px solid var(--line)}
ul.list a{display:grid;grid-template-columns:120px 1fr;gap:18px;padding:18px 0;color:var(--ink);text-decoration:none;align-items:start}
ul.list img{width:120px;height:90px;object-fit:cover;border-radius:3px;background:#f2f2f2}
ul.list img.doc{object-position:top}
ul.list .t{font-weight:700;font-size:18px;line-height:1.4}
ul.list a:hover .t{text-decoration:underline}
.meta{font-size:14px;color:var(--sub)}
ul.list p{margin:4px 0 0;font-size:15px;color:#444}
.empty{padding:40px 0;color:var(--sub)}
.back{font-size:15px;display:inline-block;margin-bottom:20px;text-decoration:none}
.hero{width:100%;aspect-ratio:3/2;object-fit:cover;border-radius:3px;margin:22px 0 8px;background:#f2f2f2}
.hero.doc{aspect-ratio:auto;max-width:360px;border:1px solid var(--line)}
table{width:100%;border-collapse:collapse;font-size:16px}
th,td{text-align:left;padding:10px 8px;border-bottom:1px solid var(--line);vertical-align:top}
th{font-size:14px;color:var(--sub);font-weight:500;border-bottom:1px solid var(--ink)}
td:first-child{white-space:nowrap;font-weight:500;padding-right:16px}
.tbl{overflow-x:auto}
.kit{font-size:13px;color:var(--accent);margin-left:6px;white-space:nowrap}
ol.steps{margin:0;padding-left:1.4em}
ol.steps li{margin-bottom:26px;padding-left:4px}
ol.steps li::marker{font-weight:700}
ol.steps img{margin-top:12px;width:100%;max-width:520px;aspect-ratio:4/3;object-fit:cover;border-radius:3px}
.caution{font-size:15px;color:#8a3b12;margin-top:4px}
.note{background:var(--note);padding:14px 18px;border-radius:4px;margin:16px 0;font-size:16px}
.dl{display:flex;flex-wrap:wrap;gap:8px 16px;align-items:baseline;border:1px solid var(--line);border-radius:4px;padding:16px 18px;margin:24px 0}
.dl a{font-weight:700}
.dl span{font-size:15px;color:var(--sub)}
.parent{border-top:1px solid var(--line);padding-top:4px}
ul.plain{margin:0;padding-left:1.2em}
ul.plain li{margin-bottom:6px}
.more li{margin-bottom:8px}
.facts{margin-top:48px;border-top:1px solid var(--ink);padding-top:16px;font-size:15px;display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:10px 24px}
.facts b{display:block;font-weight:500;color:var(--sub);font-size:13px}
.tabs{display:flex;gap:4px;margin:20px 0 8px}
.prog h2{margin-top:36px}
.prog td:first-child{font-weight:400;color:#444;width:42%}
.soon{color:#999;font-size:15px}
footer{border-top:1px solid var(--line);padding:24px 0 40px;font-size:14px;color:var(--sub)}
@media (max-width:560px){ul.list a{grid-template-columns:88px 1fr;gap:14px}ul.list img{width:88px;height:66px}h1{font-size:24px}}
</style>
</head>
<body>
<header><div class="w">
<a class="brand" href="#/">DNA Kids Lab<small>디엔에이 키즈랩</small></a>
<nav aria-label="메뉴"><a href="#/" data-nav="">활동</a><a href="#/progress" data-nav="progress">진도표</a><a href="#/downloads" data-nav="downloads">도안 모음</a></nav>
</div></header>
<main class="w" id="app"><p class="sub">불러오는 중…</p></main>
<footer><div class="w">DNA Kids Lab · 도안은 가정에서 자유롭게 인쇄해 쓰셔도 됩니다.</div></footer>
<script>
const SUPABASE_URL = 'https://lnnyevytmpgvdqtpfyjt.supabase.co';
const SUPABASE_KEY = 'sb_publishable_tJppUfQ22tu3GjSajvq-4w_CMB87DL4';
const app = document.getElementById('app');
const MATS = ['우유팩','페트병','종이컵','휴지심','상자','병뚜껑','이면지'];
const state = { band: '전체', subject: '전체', mat: '전체', pband: '3~4' };
try { const s = JSON.parse(localStorage.getItem('dnakids_filters') || '{}'); Object.assign(state, s); } catch (e) {}
const save = () => { try { localStorage.setItem('dnakids_filters', JSON.stringify({ band: state.band, subject: state.subject, mat: state.mat })); } catch (e) {} };
const cache = {};
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
async function api(path) {
  if (cache[path]) return cache[path];
  const r = await fetch(SUPABASE_URL + '/rest/v1/' + path, { headers: { apikey: SUPABASE_KEY } });
  if (!r.ok) throw new Error('내용을 불러오지 못했습니다. 잠시 뒤 다시 열어 주세요.');
  return (cache[path] = await r.json());
}
const listAll = () => api('activities?select=slug,subject,band,topic,title,summary,duration,tags,hero_image,hero_is_doc,template_pdf&order=sort_order');
const short = d => String(d || '').replace(/^난이도\s*/, '').replace(/[★☆]/g, '').trim();
const fbtn = (key, v, label) => `<button class="f" data-k="${key}" data-v="${esc(v)}" aria-pressed="${state[key] === v}">${esc(label || v)}</button>`;

async function viewHome() {
  const all = await listAll();
  const list = all.filter(a => (state.band === '전체' || a.band === state.band) && (state.subject === '전체' || a.subject === state.subject) && (state.mat === '전체' || (a.tags || []).includes(state.mat)));
  app.innerHTML = `
  <h1>집에서 해 보는 과학·수학·영어</h1>
  <div class="intro"><p>우유팩, 페트병, 휴지심처럼 집에 있는 재료로 초등 3~6학년 교과 내용을 직접 해 볼 수 있게 정리했습니다. 활동마다 준비물과 순서, 부모님이 읽어 볼 설명, 인쇄용 도안을 함께 올려 두었습니다.</p></div>
  <div class="filters">
    <div class="grp" role="group" aria-label="학년"><span class="lab">학년</span>${fbtn('band','전체')}${fbtn('band','3~4','3~4학년')}${fbtn('band','5~6','5~6학년')}</div>
    <div class="grp" role="group" aria-label="과목"><span class="lab">과목</span>${['전체','과학','수학','영어'].map(s => fbtn('subject', s)).join('')}</div>
    <div class="grp"><label class="lab" for="mat">재료</label><select id="mat"><option value="전체">전체</option>${MATS.map(m => `<option ${m === state.mat ? 'selected' : ''}>${m}</option>`).join('')}</select></div>
  </div>
  <p class="count">${list.length}개</p>
  ${list.length ? `<ul class="list">${list.map(a => `<li><a href="#/a/${esc(a.slug)}"><img src="${esc(a.hero_image)}" alt="" loading="lazy" class="${a.hero_is_doc ? 'doc' : ''}"><div><div class="t">${esc(a.title)}</div><div class="meta">${esc(a.subject)} · ${esc(a.band)}학년 · ${esc(a.topic)} · ${esc(a.duration)}</div><p>${esc(a.summary)}</p></div></a></li>`).join('')}</ul>`
    : `<p class="empty">조건에 맞는 활동이 아직 없습니다. 재료나 학년을 바꿔 보세요.</p>`}`;
  app.querySelectorAll('.f').forEach(b => b.onclick = () => { state[b.dataset.k] = b.dataset.v; save(); viewHome(); });
  document.getElementById('mat').onchange = e => { state.mat = e.target.value; save(); viewHome(); };
}

async function viewProgress() {
  const [topics, all] = await Promise.all([api('topics?select=band,subject,name,sort_order,activity_slug&order=sort_order'), listAll()]);
  const title = Object.fromEntries(all.map(a => [a.slug, a.title]));
  const b = state.pband;
  const ts = topics.filter(t => t.band === b);
  app.innerHTML = `<div class="narrow prog">
  <h1>진도표</h1>
  <p class="sub">국가 교육과정의 학년군 주제별로 정리했습니다. 교과서는 출판사마다 단원 이름과 순서가 달라서, 모든 교과서에 공통으로 나오는 주제를 기준으로 했습니다.</p>
  <div class="tabs" role="group" aria-label="학년군">${['3~4','5~6'].map(x => `<button class="f" data-b="${x}" aria-pressed="${x === b}">${x}학년</button>`).join('')}</div>
  ${['과학','수학','영어'].map(s => { const rows = ts.filter(t => t.subject === s); const n = rows.filter(t => t.activity_slug).length;
    return `<h2>${s} <span class="sub" style="font-weight:400;font-size:15px">${n}/${rows.length}</span></h2><table><tbody>${rows.map(t => `<tr><td>${esc(t.name)}</td><td>${t.activity_slug ? `<a href="#/a/${esc(t.activity_slug)}">${esc(title[t.activity_slug] || '')}</a>` : '<span class="soon">준비 중</span>'}</td></tr>`).join('')}</tbody></table>`; }).join('')}
  </div>`;
  app.querySelectorAll('[data-b]').forEach(x => x.onclick = () => { state.pband = x.dataset.b; viewProgress(); });
}

async function viewDownloads() {
  const all = (await listAll()).filter(a => a.template_pdf);
  app.innerHTML = `<div class="narrow"><h1>도안 모음</h1><p class="sub">A4 용지에 배율 100%(실제 크기)로 인쇄해 주세요.</p>
  ${['과학','수학','영어'].map(s => `<h2>${s}</h2><table><tbody>${all.filter(a => a.subject === s).map(a => `<tr><td>${esc(a.title)}</td><td><a href="${esc(a.template_pdf)}" download>PDF 내려받기</a></td></tr>`).join('')}</tbody></table>`).join('')}</div>`;
}

function block(c) {
  switch (c.type) {
    case 'materials': return `<h2>준비물</h2>${c.note ? `<p class="sub">${esc(c.note)}</p>` : ''}<div class="tbl"><table><tbody>${c.rows.map(r => `<tr><td>${esc(r.name)}</td><td>${esc(r.how)}${r.kit ? '<span class="kit">· 키트 예정</span>' : ''}</td></tr>`).join('')}</tbody></table></div>${c.image ? `<img src="${esc(c.image)}" alt="준비물을 한데 모아 놓은 모습" loading="lazy" style="margin-top:18px;width:100%;max-width:520px;aspect-ratio:4/3;object-fit:cover;border-radius:3px">` : ''}`;
    case 'steps': return `<h2>${esc(c.title)}</h2><ol class="steps">${c.items.map(s => `<li><h3>${esc(s.title)}</h3><p style="margin:4px 0 0">${esc(s.body)}</p>${s.warn ? `<p class="caution">${esc(s.warn)}</p>` : ''}${s.image ? `<img src="${esc(s.image)}" alt="${esc(s.title)}" loading="lazy">` : ''}</li>`).join('')}</ol>${(c.notes || []).map(n => `<div class="note">${esc(n)}</div>`).join('')}`;
    case 'questions': return `<h2>${esc(c.title)}</h2><ul class="plain">${c.items.map(q => `<li>${esc(q)}</li>`).join('')}</ul>`;
    case 'explain': return `${c.title ? `<h2>${esc(c.title)}</h2>` : '<h2>부모님께</h2>'}${c.boxes.map(b => `<h3 style="margin-top:18px">${esc(b.label)}</h3>${b.paras.map(p => `<p>${esc(p)}</p>`).join('')}`).join('')}`;
    case 'more': return `<h2>더 해보기</h2><ul class="plain more">${c.items.map(m => `<li><b>${esc(m.title)}</b> — ${esc(m.body)}</li>`).join('')}</ul>`;
    case 'table': return `<h2>${esc(c.title)}</h2><div class="tbl"><table><thead><tr>${c.head.map(h => `<th>${esc(h)}</th>`).join('')}</tr></thead><tbody>${c.rows.map(r => `<tr>${r.map(v => `<td>${esc(v)}</td>`).join('')}</tr>`).join('')}</tbody></table></div>${c.note ? `<p class="sub" style="font-size:15px;margin-top:10px">${esc(c.note)}</p>` : ''}`;
    case 'template': return c.pdf ? `<div class="dl"><a href="${esc(c.pdf)}" download>${esc(c.title)} 내려받기 (PDF)</a><span>${esc(c.desc)}</span></div>` : '';
    case 'note': return `<div class="note">${esc(c.text)}</div>`;
    case 'info': return `<div class="facts">${c.items.map(i => `<div><b>${esc(i.label)}</b>${esc(i.value)}</div>`).join('')}</div>`;
  }
  return '';
}

async function viewActivity(slug) {
  const a = (await api('activities?slug=eq.' + encodeURIComponent(slug) + '&select=*'))[0];
  if (!a) { app.innerHTML = `<p class="empty">찾는 활동이 없습니다. <a href="#/">목록으로</a></p>`; return; }
  document.title = a.title + ' · DNA Kids Lab';
  const caution = (a.caution || []).filter(c => !c.includes('혼자'));
  app.innerHTML = `<article class="narrow">
    <a class="back" href="#/">← 활동 목록</a>
    <h1>${esc(a.title)}</h1>
    <div class="meta">${esc(a.subject)} · ${esc(a.band)}학년 · ${esc(a.topic)} · ${esc(a.duration)} · ${esc(short(a.difficulty))}</div>
    <img class="hero ${a.hero_is_doc ? 'doc' : ''}" src="${esc(a.hero_image)}" alt="${esc(a.title)}">
    <p style="font-size:18px;margin-top:18px">${esc(a.summary)}</p>
    ${caution.length ? `<p class="caution">주의: ${esc(caution.join(', '))}</p>` : ''}
    ${a.content.map(block).join('')}
  </article>`;
}

async function route() {
  const h = decodeURIComponent(location.hash.replace(/^#\/?/, ''));
  const [p, arg] = h.split('/');
  document.title = 'DNA Kids Lab · 집에서 해 보는 과학·수학·영어';
  document.querySelectorAll('nav a').forEach(x => x.classList.toggle('on', x.dataset.nav === (p === 'a' ? '' : (p || ''))));
  try {
    if (p === 'a' && arg) await viewActivity(arg);
    else if (p === 'progress') await viewProgress();
    else if (p === 'downloads') await viewDownloads();
    else await viewHome();
    window.scrollTo(0, 0);
  } catch (e) {
    app.innerHTML = `<p class="empty">${esc(e.message)} <button class="f" onclick="location.reload()">다시 열기</button></p>`;
  }
}
window.addEventListener('hashchange', route);
route();
</script>
</body>
</html>
