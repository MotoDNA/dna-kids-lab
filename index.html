/* 단계별 */
.dfx.t-perfect .dfx-title{color:#e08a00}

.dfx.t-good img{animation:dfxPop .55s cubic-bezier(.2,1.6,.4,1) both,dfxWiggle 1.4s .55s ease-in-out infinite}
.dfx.t-okay .dfx-title{color:#2f6db5}

.dfx.t-low .dfx-title{color:#d0566a}

@keyframes dfxSpin{to{transform:rotate(360deg)}}
@keyframes dfxJumpIn{0%{transform:translateY(160px) rotate(-30deg) scale(.4);opacity:0}60%{transform:translateY(-30px) rotate(370deg) scale(1.1);opacity:1}100%{transform:translateY(0) rotate(360deg) scale(1)}}
@keyframes dfxHop{0%,100%{transform:translateY(0) rotate(360deg) scaleY(1)}15%{transform:translateY(0) rotate(360deg) scaleY(.9) scaleX(1.06)}45%{transform:translateY(-34px) rotate(360deg) scaleY(1.04)}}
@keyframes dfxPop{0%{transform:scale(.2);opacity:0}100%{transform:scale(1);opacity:1}}
@keyframes dfxWiggle{0%,100%{transform:rotate(0)}25%{transform:rotate(-7deg) translateY(-6px)}75%{transform:rotate(7deg) translateY(-6px)}}
@keyframes dfxSlide{0%{transform:translateX(-140px);opacity:0}100%{transform:translateX(0);opacity:1}}
@keyframes dfxSway{0%,100%{transform:rotate(-4deg)}50%{transform:rotate(4deg)}}
@keyframes dfxRise{0%{transform:translateY(60px);opacity:0}100%{transform:translateY(0);opacity:1}}
@keyframes dfxFloat{0%,100%{transform:translateY(0)}50%{transform:translateY(-10px)}}
@keyframes dfxTwinkle{0%,100%{transform:scale(.6) rotate(0);opacity:.5}50%{transform:scale(1.2) rotate(20deg);opacity:1}}
@keyframes dfxHeart{0%{transform:translateY(40px) scale(.6);opacity:0}20%{opacity:1}100%{transform:translateY(-170px) scale(1.1);opacity:0}}

/* ---------- 분수 1/2 → 위아래로 쌓인 진짜 분수 모양 ---------- */
const FRAC_RE = /(^|[^\d/.])(\d{1,3})\/(\d{1,3})(?![\d/])/g;
function fracify(root) {
  if (!root) return;
  const w = document.createTreeWalker(root, NodeFilter.SHOW_TEXT, { acceptNode: n => (/\d\/\d/.test(n.nodeValue) && !n.parentElement.closest('.fr,script,style,textarea,.say,a[href^="http"]')) ? 1 : 2 });
  const nodes = []; while (w.nextNode()) nodes.push(w.currentNode);
  nodes.forEach(n => {
    const span = document.createElement('span');
    span.innerHTML = esc(n.nodeValue).replace(FRAC_RE, (m, pre, a, b) => `${pre}<span class="fr" role="math" aria-label="${b}분의 ${a}"><span class="fn">${a}</span><span class="fd">${b}</span></span>`);
    n.replaceWith(...span.childNodes);
  });
}

/* ---------- 정답 소리·효과 (파일 없이 브라우저에서 직접 만든 소리) ---------- */
function sfxOn() { try { return localStorage.getItem('dnakids_sfx') !== '0'; } catch (e) { return true; } }
let actx = null;
function sfx(kind) {
  if (!sfxOn()) return;
  try {
    actx = actx || new (window.AudioContext || window.webkitAudioContext)();
    if (actx.state === 'suspended') actx.resume();
    const t0 = actx.currentTime + 0.01;
    const tone = (freq, at, dur, type = 'triangle', vol = 0.22) => {
      const o = actx.createOscillator(), g = actx.createGain();
      o.type = type; o.frequency.setValueAtTime(freq, t0 + at);
      g.gain.setValueAtTime(0.0001, t0 + at); g.gain.exponentialRampToValueAtTime(vol, t0 + at + 0.015);
      g.gain.exponentialRampToValueAtTime(0.0001, t0 + at + dur);
      o.connect(g).connect(actx.destination); o.start(t0 + at); o.stop(t0 + at + dur + 0.05);
    };
    if (kind === 'right') { tone(1046.5, 0, 0.18); tone(1318.5, 0.09, 0.22); tone(1568, 0.18, 0.4); tone(2093, 0.18, 0.35, 'sine', 0.08); }
    else if (kind === 'wrong') { tone(392, 0, 0.18, 'sine', 0.16); tone(330, 0.15, 0.3, 'sine', 0.14); }
    else if (kind === 'flip') {
      // 종이 넘기는 소리: 짧은 잡음을 대역 필터로 쓸어 내려 "사락" 느낌을 낸다
      const len = 0.32, buf = actx.createBuffer(1, actx.sampleRate * len, actx.sampleRate), d = buf.getChannelData(0);
      for (let i = 0; i < d.length; i++) d[i] = (Math.random() * 2 - 1) * (0.6 + 0.4 * Math.random());
      const src = actx.createBufferSource(); src.buffer = buf;
      const bp = actx.createBiquadFilter(); bp.type = 'bandpass'; bp.Q.value = 0.9;
      bp.frequency.setValueAtTime(2600, t0); bp.frequency.exponentialRampToValueAtTime(900, t0 + len);
      const hp = actx.createBiquadFilter(); hp.type = 'highpass'; hp.frequency.value = 400;
      const g = actx.createGain();
      g.gain.setValueAtTime(0.0001, t0); g.gain.exponentialRampToValueAtTime(0.12, t0 + 0.05);
      g.gain.exponentialRampToValueAtTime(0.04, t0 + 0.16); g.gain.exponentialRampToValueAtTime(0.0001, t0 + len);
      src.connect(bp).connect(hp).connect(g).connect(actx.destination); src.start(t0); src.stop(t0 + len + 0.02);
    }
    else if (kind === 'perfect') { [523.3, 659.3, 784, 1046.5, 784, 1046.5, 1318.5].forEach((f, k) => tone(f, k * 0.11, k === 6 ? 0.6 : 0.2, 'triangle', 0.2)); }
  } catch (e) {}
}

    <div class="dfx-btns">${tier === 'perfect' || tier === 'good' ? '' : '<button class="s" data-a="retry">다시 풀기</button>'}<button class="p" data-a="ok">${tier === 'perfect' ? '야호!' : '확인'}</button></div></div>`;

  document.addEventListener('keydown', key);

  if (T.sfx && typeof sfx === 'function') setTimeout(() => sfx(T.sfx), 250);

let PV_INDEX = null;
const pvIndex = () => PV_INDEX || (PV_INDEX = fetch('assets/preview/index.json?v=1').then(r => r.ok ? r.json() : {}).catch(() => ({})));
const pvKey = href => { try { const u = new URL(href, location.href); const m = u.pathname.match(/assets\/(pdf|workbook|writing)\/([^/]+)\.pdf$/); return m ? { path: `assets/${m[1]}/${m[2]}.pdf`, base: `assets/preview/${m[1]}__${decodeURIComponent(m[2])}` } : null; } catch (e) { return null; } };
async function addPdfPreviews(root) {
  const idx = await pvIndex();
  (root || document).querySelectorAll('a[href$=".pdf"]').forEach(a => {
    if (a.dataset.pv || (a.previousElementSibling && a.previousElementSibling.classList.contains('pv-btn'))) return;
    const k = pvKey(a.getAttribute('href')); if (!k || !idx[k.path]) return;
    a.dataset.pv = '1';
    const b = document.createElement('button'); b.type = 'button'; b.className = 'pv-btn'; b.textContent = '👀 미리 보기';
    const row = a.closest('tr'); const t = row ? row.querySelector('td') : null;
    const title = ((t && t.firstChild && t.firstChild.textContent) || a.textContent || 'PDF').trim();
    b.onclick = () => openPdfPreview(k, idx[k.path], a.getAttribute('href'), title);
    a.parentNode.insertBefore(b, a);
  });
}
function openPdfPreview(k, pages, href, title) {
  const shown = Math.min(pages, 3);
  const d = document.createElement('div'); d.className = 'pv-dlg'; d.setAttribute('role', 'dialog'); d.setAttribute('aria-modal', 'true'); d.setAttribute('aria-label', title + ' 미리 보기');
  d.innerHTML = `<div class="pv-box"><div class="pv-head"><b>${esc(title)}</b><button type="button" class="pv-x" aria-label="닫기">×</button></div>
    <div class="pv-pages">${Array.from({ length: shown }, (_, i) => `<img src="${k.base}_${i + 1}.webp" alt="${i + 1}쪽" loading="lazy">`).join('')}${pages > shown ? `<div class="pv-more">전체 ${pages}쪽 중 앞 ${shown}쪽이에요.</div>` : `<div class="pv-more">전체 ${pages}쪽</div>`}</div>
    <div class="pv-foot"><a class="op" href="${esc(href)}" target="_blank" rel="noopener">새 창에서 전체 보기</a><a class="dl" href="${esc(href)}" download>PDF 내려받기</a></div></div>`;
  const prev = document.activeElement;
  const close = () => { d.remove(); document.removeEventListener('keydown', key); document.body.style.overflow = ''; if (prev && prev.focus) prev.focus(); };
  const key = e => { if (e.key === 'Escape') close(); };

  document.addEventListener('keydown', key); document.body.appendChild(d); document.body.style.overflow = 'hidden'; d.querySelector('.pv-x').focus();
  try { gtag('event', 'pdf_preview', { file: k.path }); } catch (e) {}
}
