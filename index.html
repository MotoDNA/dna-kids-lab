<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>DNA Kids Lab · 집에서 만드는 과학·수학·영어</title>
<meta name="description" content="버리려던 우유팩, 페트병, 휴지심으로 학교 진도에 맞춘 실험과 놀이를. 초등 3~6학년 과학·수학·영어 활동과 인쇄용 도안.">
<meta property="og:title" content="DNA Kids Lab · 학원 대신, 우리 집 식탁에서">
<meta property="og:description" content="재활용품으로 하는 초등 과학·수학·영어 활동 25개와 인쇄용 도안">
<meta property="og:image" content="assets/img/e1_done.jpg">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Do+Hyeon&family=Noto+Sans+KR:wght@400;500;700&display=swap">
<style>
:root{
  --ink:#1B2A4A; --ink2:#33415E; --muted:#4E5D78; --line:#DCE3EC; --soft:#F3F6FA; --bg:#FFFFFF;
  --yellow:#FFD23F; --teal:#13707F; --teal-bg:#E7F3F5; --teal-ink:#0C4F5A;
  --math-bg:#FFF6D6; --math-ink:#7A5B00; --eng-bg:#FFF1E8; --eng-ink:#9A3412;
  --display:'Do Hyeon',sans-serif; --body:'Noto Sans KR','Apple SD Gothic Neo','Malgun Gothic',sans-serif;
}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--body);font-size:17px;line-height:1.65}
a{color:var(--teal)}
img{max-width:100%}
button{font-family:inherit}
:focus-visible{outline:3px solid var(--teal);outline-offset:2px}
.wrap{max-width:1180px;margin:0 auto;padding-inline:20px}
header.top{border-bottom:1px solid var(--line);position:sticky;top:0;background:rgba(255,255,255,.96);backdrop-filter:blur(6px);z-index:5}
header.top .wrap{display:flex;flex-wrap:wrap;gap:8px 24px;align-items:center;justify-content:space-between;padding-block:12px}
.logo{font-family:var(--display);font-size:30px;color:var(--ink);text-decoration:none;letter-spacing:-.5px}
.logo span{background:var(--yellow);padding:0 6px;border-radius:6px}
nav.main{display:flex;flex-wrap:wrap;gap:4px 20px;font-weight:500;font-size:16px}
nav.main a{color:var(--ink);text-decoration:none;padding:4px 0;border-bottom:3px solid transparent}
nav.main a.on{color:var(--teal);border-bottom-color:var(--yellow)}
main{padding-block:28px 72px}
h1,h2,.disp{font-family:var(--display);font-weight:400;margin:0;line-height:1.12;text-wrap:balance}
h1{font-size:clamp(40px,7vw,64px)}
h2{font-size:clamp(28px,4vw,38px)}
h3{margin:0;font-size:20px}
.stack{display:flex;flex-direction:column}
.g8{gap:8px}.g12{gap:12px}.g16{gap:16px}.g24{gap:24px}.g40{gap:40px}.g64{gap:64px}
.row{display:flex;flex-wrap:wrap}
.muted{color:var(--muted)}
.lead{font-size:20px;color:var(--ink2);margin:0;max-width:36em}
.pill{display:inline-block;padding:4px 12px;border-radius:999px;font-size:14px;font-weight:500;background:var(--soft)}
.pill.sci{background:var(--teal-bg);color:var(--teal-ink);font-weight:700}
.pill.math{background:var(--math-bg);color:var(--math-ink);font-weight:700}
.pill.eng{background:var(--eng-bg);color:var(--eng-ink);font-weight:700}
.pill.warn{background:var(--eng-bg);color:var(--eng-ink)}
.pill.dl{background:var(--yellow);font-weight:700}
.btn{display:inline-flex;align-items:center;min-height:48px;padding:10px 22px;border-radius:12px;font-weight:700;text-decoration:none;border:2px solid var(--ink);cursor:pointer;font-size:17px}
.btn.dark{background:var(--ink);color:#fff}
.btn.light{background:#fff;color:var(--ink)}
.btn.yellow{background:var(--yellow);color:var(--ink)}
.seg{min-height:48px;padding:8px 20px;border-radius:12px;font-size:18px;font-weight:700;cursor:pointer;background:#fff;color:var(--ink);border:2px solid #B8C2D3}
.seg[aria-pressed="true"],.seg[aria-selected="true"]{background:var(--ink);color:#fff;border-color:var(--ink)}
.chip{min-height:44px;padding:6px 16px;border-radius:999px;font-size:15px;font-weight:500;cursor:pointer;background:#fff;color:var(--ink);border:1px solid #B8C2D3}
.chip[aria-pressed="true"]{background:var(--yellow);border:2px solid var(--ink)}
.cards{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:20px}
.card{display:flex;flex-direction:column;text-decoration:none;color:var(--ink);border:1px solid var(--line);border-radius:16px;overflow:hidden;background:#fff;transition:transform .15s,box-shadow .15s}
.card:hover{transform:translateY(-2px);box-shadow:0 8px 24px rgba(27,42,74,.10)}
.card img{width:100%;aspect-ratio:4/3;object-fit:cover;display:block;background:var(--soft)}
.card img.doc{object-position:center top}
.card .b{padding:14px 16px 18px;display:flex;flex-direction:column;gap:8px}
.card .t{font-size:19px;font-weight:700;line-height:1.35}
.hero{display:flex;flex-wrap:wrap;gap:36px;align-items:center}
.hero>div{flex:1 1 420px;min-width:0}
.hero>img{flex:1 1 440px;min-width:0;width:100%;aspect-ratio:4/3;object-fit:cover;border-radius:20px}
.hero>img.doc{flex:0 1 300px;aspect-ratio:620/876;border:1px solid var(--line)}
.stat .n{font-family:var(--display);font-size:36px;line-height:1}
.panel{background:var(--soft);border-radius:18px;padding:22px 24px}
.subj{border-radius:20px;padding:26px;text-decoration:none;color:var(--ink);display:flex;flex-direction:column;gap:8px}
.band{background:var(--ink);color:#fff;border-radius:24px;padding:32px;display:flex;flex-wrap:wrap;gap:24px;align-items:center;justify-content:space-between}
table{width:100%;border-collapse:collapse;font-size:16px}
th{text-align:left;padding:10px 12px;border-bottom:2px solid var(--ink)}
td{padding:12px;border-bottom:1px solid var(--line);vertical-align:top}
td:first-child{font-weight:700}
.tbl{overflow-x:auto}
.kit{display:inline-block;margin-left:6px;background:var(--yellow);padding:0 8px;border-radius:6px;font-size:13px;font-weight:700}
ol.steps{margin:0;padding:0;list-style:none;display:flex;flex-direction:column;gap:26px}
ol.steps li{display:flex;flex-wrap:wrap;gap:22px;align-items:center}
ol.steps li img{flex:0 1 400px;min-width:0;width:100%;aspect-ratio:4/3;object-fit:cover;border-radius:14px}
ol.steps .txt{flex:1 1 300px;min-width:0;display:flex;gap:16px}
.num{flex:none;width:44px;height:44px;border-radius:50%;background:var(--yellow);display:flex;align-items:center;justify-content:center;font-family:var(--display);font-size:24px}
.txt p{margin:6px 0 0}
.warn{color:var(--eng-ink);font-size:15px;font-weight:500}
.note{background:var(--eng-bg);color:#7C2D12;border-radius:14px;padding:16px 20px}
.boxes{display:grid;grid-template-columns:repeat(auto-fit,minmax(300px,1fr));gap:20px}
.box{border-radius:18px;padding:24px;display:flex;flex-direction:column;gap:10px}
.box p{margin:0}
.box .lab{font-size:14px;font-weight:700;letter-spacing:1px}
.box.kid{border:2px solid var(--ink)} .box.kid .lab{color:var(--teal)}
.box.par{background:var(--teal-bg)} .box.par .lab{color:var(--teal-ink)}
.more{display:grid;grid-template-columns:repeat(auto-fit,minmax(230px,1fr));gap:16px}
.more div{background:var(--soft);border-radius:14px;padding:18px}
.more p{margin:4px 0 0;font-size:16px}
.tpl{border:2px dashed var(--ink);border-radius:18px;padding:24px;display:flex;flex-direction:column;gap:10px}
.tpl p{margin:0}
.info{border-top:2px solid var(--ink);padding-top:22px;display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:18px}
.info .l{font-size:13px;font-weight:700;letter-spacing:1px;color:var(--muted)}
.info .v{font-weight:500}
.crumb{font-size:14px;color:var(--muted)}
.crumb a{color:var(--muted)}
.prog{display:grid;grid-template-columns:repeat(auto-fit,minmax(290px,1fr));gap:20px;align-items:start}
.pcol{border-radius:20px;padding:20px 14px 14px;display:flex;flex-direction:column;gap:10px}
.pcol .hd{display:flex;justify-content:space-between;align-items:baseline;padding-inline:8px}
.bar{height:8px;border-radius:999px;background:#fff;overflow:hidden;margin-inline:8px}
.bar i{display:block;height:100%;border-radius:999px}
.pcol ol{margin:0;padding:0;list-style:none;display:flex;flex-direction:column;gap:6px}
.pcol li{background:#fff;border-radius:12px;padding:11px 14px}
.pcol li a{display:flex;justify-content:space-between;gap:8px;font-weight:700;color:var(--ink);text-decoration:none}
.soon{display:inline-block;font-size:13px;color:var(--muted);background:var(--soft);border:1px dashed #B8C2D3;padding:0 10px;border-radius:999px}
.empty{border:2px dashed #B8C2D3;border-radius:16px;padding:28px;text-align:center;color:var(--muted)}
.loading{padding:80px 0;text-align:center;color:var(--muted)}
footer{border-top:1px solid var(--line);padding:26px 0;color:var(--muted);font-size:14px}
footer .wrap{display:flex;flex-wrap:wrap;gap:8px 24px;justify-content:space-between}
@media (prefers-reduced-motion:reduce){.card{transition:none}}
</style>
</head>
<body>
<header class="top"><div class="wrap">
<a class="logo" href="#/" aria-label="DNA Kids Lab 홈">DNA <span>Kids</span> Lab</a>
<nav class="main" aria-label="주 메뉴">
<a href="#/progress" data-nav="progress">학년별 진도표</a>
<a href="#/subject/과학" data-nav="과학">과학</a>
<a href="#/subject/수학" data-nav="수학">수학</a>
<a href="#/subject/영어" data-nav="영어">영어</a>
</nav>
</div></header>
<main class="wrap" id="app"><div class="loading">불러오는 중…</div></main>
<footer><div class="wrap"><span>DNA Kids Lab (디엔에이 키즈랩) · 집에서 만드는 과학·수학·영어</span><span>모든 도안은 가정에서 자유롭게 인쇄해 쓸 수 있어요</span></div></footer>
<script>
// ===== 설정: Supabase 프로젝트 주소와 공개(anon) 키 =====
const SUPABASE_URL = 'https://lnnyevytmpgvdqtpfyjt.supabase.co';
const SUPABASE_KEY = 'sb_publishable_tJppUfQ22tu3GjSajvq-4w_CMB87DL4';
// ======================================================
const app = document.getElementById('app');
const SUBJ_CLASS = {'과학':'sci','수학':'math','영어':'eng'};
const MATS = ['전체','우유팩','페트병','종이컵','휴지심','상자','병뚜껑','이면지'];
const state = { grade: 3, mat: '전체', band: '3~4' };
try { const g = +localStorage.getItem('dnakids_grade'); if (g >= 3 && g <= 6) state.grade = g; } catch (e) {}
const cache = {};

const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
async function api(path) {
  if (cache[path]) return cache[path];
  const r = await fetch(SUPABASE_URL + '/rest/v1/' + path, { headers: { apikey: SUPABASE_KEY } });
  if (!r.ok) throw new Error('데이터를 불러오지 못했어요 (' + r.status + ')');
  return (cache[path] = await r.json());
}
const listAll = () => api('activities?select=slug,subject,band,topic,title,summary,difficulty,duration,tags,hero_image,hero_is_doc&order=sort_order');
const pill = (t, cls = '') => `<span class="pill ${cls}">${esc(t)}</span>`;

function card(a) {
  return `<a class="card" href="#/a/${esc(a.slug)}">
    <img src="${esc(a.hero_image)}" alt="" loading="lazy" class="${a.hero_is_doc ? 'doc' : ''}">
    <div class="b"><div class="row g8">${pill(a.subject, SUBJ_CLASS[a.subject])}${pill(a.band + '학년')}${pill(a.duration)}</div>
    <div class="t">${esc(a.title)}</div>
    <div class="muted" style="font-size:14px">${a.tags && a.tags.length ? '재료: ' + esc(a.tags.join(', ')) : '부엌 재료로 해요'}</div></div></a>`;
}

async function viewHome() {
  const all = await listAll();
  const band = state.grade <= 4 ? '3~4' : '5~6';
  const list = all.filter(a => a.band === band && (state.mat === '전체' || (a.tags || []).includes(state.mat)));
  app.innerHTML = `<div class="stack g64">
  <section class="hero">
    <div class="stack g24">
      <div style="font-size:15px;font-weight:700;letter-spacing:1px;color:var(--teal)">초등 3~6학년 · 과학 · 수학 · 영어</div>
      <h1>학원 대신,<br>우리 집 <span style="background:linear-gradient(transparent 58%,var(--yellow) 58%)">식탁에서</span></h1>
      <p class="lead">버리려던 우유팩, 페트병, 휴지심으로 학교 진도에 맞춘 실험과 놀이를 해요. 준비물, 순서, 인쇄용 도안, 부모님용 설명까지 한 페이지에 다 있어요.</p>
      <div class="row g12"><a class="btn dark" href="#grade">우리 아이 학년 고르기</a><a class="btn light" href="#/progress">학년별 진도표 보기</a></div>
      <div class="row" style="gap:28px">
        <div class="stat"><div class="n">${all.length}<small style="font-size:20px">개</small></div><div class="muted" style="font-size:14px">활동</div></div>
        <div class="stat"><div class="n">22<small style="font-size:20px">종</small></div><div class="muted" style="font-size:14px">인쇄용 도안</div></div>
        <div class="stat"><div class="n">0<small style="font-size:20px">원</small></div><div class="muted" style="font-size:14px">대부분 집 재료로</div></div>
      </div>
    </div>
    <img src="assets/img/e1_done.jpg" alt="거실에서 두 아이가 종이컵 실전화로 이야기하는 모습">
  </section>
  <section id="grade" class="stack g24">
    <div class="row g8" style="justify-content:space-between;align-items:baseline"><h2>우리 아이 학년은?</h2><span class="muted" style="font-size:15px">학년을 누르면 지금 할 수 있는 활동이 나와요</span></div>
    <div class="row g8" role="group" aria-label="학년 선택">${[3,4,5,6].map(g => `<button class="seg" data-grade="${g}" aria-pressed="${g === state.grade}">${g}학년</button>`).join('')}</div>
    <div class="panel stack g12"><b style="font-size:15px">집에 있는 재료로 찾기</b>
      <div class="row g8" role="group" aria-label="재료 선택">${MATS.map(m => `<button class="chip" data-mat="${m}" aria-pressed="${m === state.mat}">${m}</button>`).join('')}</div></div>
    <div><b>${state.grade}학년</b> · ${state.mat === '전체' ? '' : esc(state.mat) + '로 하는 '}활동 <b>${list.length}개</b> <span class="muted" style="font-size:15px">(${band}학년군 교육과정 기준)</span></div>
    ${list.length ? `<div class="cards">${list.map(card).join('')}</div>` : `<div class="empty">이 학년에는 아직 이 재료로 하는 활동이 없어요. 다른 재료를 눌러 보세요.</div>`}
  </section>
  <section class="stack g24"><h2>과목별로 보기</h2>
    <div class="boxes">
      <a class="subj" href="#/subject/과학" style="background:var(--teal-bg)"><div class="disp" style="font-size:34px">과학 실험실</div><p style="margin:0">재활용품으로 하는 실험. 준비물, 사진, 원리 설명, 도안까지.</p><b style="color:var(--teal-ink)">실험 보기 →</b></a>
      <a class="subj" href="#/subject/수학" style="background:var(--math-bg)"><div class="disp" style="font-size:34px">손으로 하는 수학</div><p style="margin:0">분수판, 곱셈 배열, 전개도처럼 만지며 깨닫는 수학 놀이.</p><b style="color:var(--math-ink)">활동 보기 →</b></a>
      <a class="subj" href="#/subject/영어" style="background:var(--eng-bg)"><div class="disp" style="font-size:34px">놀며 말하는 영어</div><p style="margin:0">대본과 뜻 풀이가 있어 영어가 서툰 부모님도 함께하는 놀이.</p><b style="color:var(--eng-ink)">활동 보기 →</b></a>
    </div></section>
  <section class="band"><div class="stack g8" style="flex:1 1 380px;min-width:0"><div style="font-size:14px;font-weight:700;letter-spacing:1px;color:var(--yellow)">처음이세요?</div><h2>이번 주말엔 이것부터</h2><p style="margin:0;color:#D7DEEA">종이컵 두 개와 실만 있으면 20분 안에 끝나요.</p></div><a class="btn yellow" href="#/a/string-phone">종이컵 실전화 시작하기</a></section>
  <section class="tpl" style="flex-direction:row;flex-wrap:wrap;align-items:center;justify-content:space-between"><div class="stack g8" style="flex:1 1 380px;min-width:0"><div style="font-size:14px;font-weight:700;letter-spacing:1px;color:var(--eng-ink)">준비 중</div><h2 style="font-size:30px">DNA 키즈랩 키트</h2><p>LED, 자석, 1cm 블록처럼 집에 없는 부품만 모아 보내 드려요. 첫 키트는 '우유팩 손전등 세트'예요.</p></div><a href="#/a/milk-carton-torch" style="font-weight:700;color:var(--ink)">우유팩 손전등 미리 보기 →</a></section>
  </div>`;
  app.querySelectorAll('[data-grade]').forEach(b => b.onclick = () => { state.grade = +b.dataset.grade; try { localStorage.setItem('dnakids_grade', state.grade); } catch (e) {} keepScroll(viewHome); });
  app.querySelectorAll('[data-mat]').forEach(b => b.onclick = () => { state.mat = b.dataset.mat; keepScroll(viewHome); });
}

async function viewSubject(subj) {
  const all = (await listAll()).filter(a => a.subject === subj);
  const sec = b => { const l = all.filter(a => a.band === b); return l.length ? `<section class="stack g16"><h2 style="font-size:30px">${b}학년</h2><div class="cards">${l.map(card).join('')}</div></section>` : ''; };
  app.innerHTML = `<div class="stack g40"><div class="crumb"><a href="#/">홈</a> › ${esc(subj)}</div>
    <h1>${{'과학':'과학 실험실','수학':'손으로 하는 수학','영어':'놀며 말하는 영어'}[subj] || esc(subj)}</h1>${sec('3~4')}${sec('5~6')}</div>`;
}

async function viewProgress() {
  const [topics, all] = await Promise.all([api('topics?select=band,subject,name,sort_order,activity_slug&order=sort_order'), listAll()]);
  const title = Object.fromEntries(all.map(a => [a.slug, a.title]));
  const b = state.band;
  const cols = [['과학','var(--teal-bg)','var(--teal)'],['수학','var(--math-bg)','#C99A00'],['영어','var(--eng-bg)','#C2410C']].map(([s, bg, bar]) => {
    const ts = topics.filter(t => t.band === b && t.subject === s);
    const done = ts.filter(t => t.activity_slug).length;
    return `<section class="pcol" style="background:${bg}"><div class="hd"><h2 style="font-size:30px">${s}</h2><b style="font-size:14px">${done} / ${ts.length} 주제</b></div>
      <div class="bar" aria-hidden="true"><i style="width:${Math.round(done / ts.length * 100)}%;background:${bar}"></i></div>
      <ol>${ts.map(t => `<li><div class="muted" style="font-size:15px">${esc(t.name)}</div>${t.activity_slug ? `<a href="#/a/${esc(t.activity_slug)}"><span>${esc(title[t.activity_slug] || '')}</span><span aria-hidden="true" style="color:var(--teal)">→</span></a>` : '<span class="soon">활동 준비 중</span>'}</li>`).join('')}</ol></section>`;
  }).join('');
  const all2 = topics.filter(t => t.band === b), ready = all2.filter(t => t.activity_slug).length;
  app.innerHTML = `<div class="stack g24"><div class="crumb"><a href="#/">홈</a> › 학년별 진도표</div>
    <h1>지금 학교에서 뭐 배우지?</h1><p class="lead">국가 교육과정의 학년군 주제를 과목별로 정리했어요. 주제 옆의 활동을 누르면 집에서 바로 해 볼 수 있어요.</p>
    <div class="row g8" role="tablist" aria-label="학년군 선택" style="align-items:center;border-bottom:2px solid var(--line);padding-bottom:14px">
      ${['3~4','5~6'].map(x => `<button class="seg" role="tab" data-band="${x}" aria-selected="${x === b}">${x}학년</button>`).join('')}
      <span class="muted" style="font-size:15px;margin-left:8px">주제 ${all2.length}개 중 ${ready}개에 활동이 있어요</span></div>
    <div class="prog">${cols}</div>
    <div class="panel"><b>우리 아이 교과서와 맞춰 보려면</b><p style="margin:6px 0 0;color:var(--ink2)">교과서는 출판사마다 단원 이름과 순서가 달라요. 그래서 DNA 키즈랩은 모든 교과서에 공통으로 들어가는 교육과정 주제로 정리했어요. 출판사별 단원 연결표는 준비 중이에요.</p></div></div>`;
  app.querySelectorAll('[data-band]').forEach(x => x.onclick = () => { state.band = x.dataset.band; viewProgress(); });
}

function block(c) {
  switch (c.type) {
    case 'materials': return `<section class="stack g16"><div class="row g12" style="align-items:baseline"><h2>준비물</h2>${c.note ? `<b style="font-size:15px;color:var(--teal)">${esc(c.note)}</b>` : ''}</div>
      <div class="row g24" style="align-items:flex-start">${c.image ? `<img src="${esc(c.image)}" alt="준비물" loading="lazy" style="flex:1 1 340px;min-width:0;width:100%;aspect-ratio:4/3;object-fit:cover;border-radius:14px">` : ''}
      <div class="tbl" style="flex:1 1 420px;min-width:0"><table><thead><tr><th style="width:34%">필요한 것</th><th>집에서 이렇게 구해요</th></tr></thead><tbody>
      ${c.rows.map(r => `<tr><td>${esc(r.name)}</td><td>${esc(r.how)}${r.kit ? '<span class="kit">키트</span>' : ''}</td></tr>`).join('')}</tbody></table></div></div></section>`;
    case 'steps': return `<section class="stack g24"><h2>${esc(c.title)}</h2><ol class="steps">${c.items.map((s, i) => `<li>${s.image ? `<img src="${esc(s.image)}" alt="${esc(s.title)}" loading="lazy">` : ''}<div class="txt"><span class="num">${i + 1}</span><div><h3>${esc(s.title)}</h3><p>${esc(s.body)}</p>${s.warn ? `<p class="warn">${esc(s.warn)}</p>` : ''}</div></div></li>`).join('')}</ol>${(c.notes || []).map(n => `<div class="note">${esc(n)}</div>`).join('')}</section>`;
    case 'questions': return `<section class="panel stack g12"><h2 style="font-size:30px">${esc(c.title)}</h2><ul style="margin:0;padding-left:22px" class="stack g8">${c.items.map(q => `<li>${esc(q)}</li>`).join('')}</ul></section>`;
    case 'explain': return `<section class="stack g16">${c.title ? `<h2>${esc(c.title)}</h2>` : ''}<div class="boxes">${c.boxes.map(b => `<div class="box ${b.label.startsWith('부모님') ? 'par' : 'kid'}"><div class="lab">${esc(b.label)}</div>${b.paras.map(p => `<p>${esc(p)}</p>`).join('')}</div>`).join('')}</div></section>`;
    case 'more': return `<section class="stack g16"><h2>더 해보기</h2><div class="more">${c.items.map(m => `<div><h3 style="font-size:18px">${esc(m.title)}</h3><p>${esc(m.body)}</p></div>`).join('')}</div></section>`;
    case 'table': return `<section class="stack g16"><h2>${esc(c.title)}</h2><div class="tbl"><table><thead><tr>${c.head.map(h => `<th>${esc(h)}</th>`).join('')}</tr></thead><tbody>${c.rows.map(r => `<tr>${r.map((v, i) => `<td style="${i === r.length - 2 && r.length > 2 || (r.length === 2 && i === 0) ? 'font-size:18px' : ''}">${esc(v)}</td>`).join('')}</tr>`).join('')}</tbody></table></div>${c.note ? `<p class="muted" style="margin:0;font-size:15px">${esc(c.note)}</p>` : ''}</section>`;
    case 'template': return `<section class="tpl"><h2 style="font-size:30px">${esc(c.title)}</h2><p>${esc(c.desc)}</p>${c.pdf ? `<a class="btn dark" style="align-self:flex-start" href="${esc(c.pdf)}" download>도안 PDF 내려받기</a>` : ''}</section>`;
    case 'note': return `<div class="note">${esc(c.text)}</div>`;
    case 'info': return `<section class="info">${c.items.map(i => `<div><div class="l">${esc(i.label)}</div><div class="v">${esc(i.value)}</div></div>`).join('')}</section>`;
  }
  return '';
}

async function viewActivity(slug) {
  const rows = await api('activities?slug=eq.' + encodeURIComponent(slug) + '&select=*');
  const a = rows[0];
  if (!a) { app.innerHTML = `<div class="empty">활동을 찾을 수 없어요. <a href="#/">홈으로</a></div>`; return; }
  document.title = a.title + ' · DNA Kids Lab';
  app.innerHTML = `<article class="stack g64">
    <section class="stack g16"><div class="crumb"><a href="#/">홈</a> › <a href="#/subject/${esc(a.subject)}">${esc(a.subject)}</a> › ${esc(a.band)}학년 › ${esc(a.topic)}</div>
    <div class="hero"><div class="stack g16"><h1>${esc(a.title)}</h1><p class="lead">${esc(a.summary)}</p>
      <div class="row g8">${pill(a.band + '학년 · ' + a.topic, SUBJ_CLASS[a.subject])}${pill(a.difficulty)}${pill(a.duration)}${(a.caution || []).map(c => pill(c, 'warn')).join('')}${a.template_pdf ? `<a class="pill dl" href="${esc(a.template_pdf)}" download style="text-decoration:none;color:var(--ink)">도안 다운로드</a>` : ''}</div></div>
      <img src="${esc(a.hero_image)}" alt="${esc(a.title)}" class="${a.hero_is_doc ? 'doc' : ''}"></div></section>
    ${a.content.map(block).join('')}
  </article>`;
}

function keepScroll(fn) { const y = window.scrollY; fn().then(() => window.scrollTo(0, y)); }
async function route() {
  const h = decodeURIComponent(location.hash.replace(/^#\/?/, ''));
  if (h === 'grade') return;
  const [p, arg] = h.split('/');
  document.title = 'DNA Kids Lab · 집에서 만드는 과학·수학·영어';
  document.querySelectorAll('nav.main a').forEach(x => x.classList.toggle('on', x.dataset.nav === (p === 'subject' ? arg : p)));
  try {
    if (p === 'a' && arg) await viewActivity(arg);
    else if (p === 'progress') await viewProgress();
    else if (p === 'subject' && arg) await viewSubject(arg);
    else await viewHome();
    if (p) window.scrollTo(0, 0);
  } catch (e) {
    app.innerHTML = `<div class="empty">${esc(e.message)}<br><button class="btn light" style="margin-top:12px" onclick="location.reload()">다시 시도</button></div>`;
  }
}
window.addEventListener('hashchange', route);
route();
</script>
</body>
</html>
