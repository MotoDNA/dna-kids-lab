/* ---------- 분수 1/2 → 위아래로 쌓인 진짜 분수 모양 ---------- */
const FRAC_RE = /(^|[^\d/.])(\d{1,3})\/(\d{1,3})(?![\d/])/g;
function fracify(root) {
  if (!root) return;
  const w = document.createTreeWalker(root, NodeFilter.SHOW_TEXT, { acceptNode: n => (/\d\/\d/.test(n.nodeValue) && !n.parentElement.closest('.fr,script,style,textarea,.say,a[href^="http"]')) ? 1 : 2 });
  const nodes = []; while (w.nextNode()) nodes.push(w.currentNode);
  nodes.forEach(n => {
    const span = document.createElement('span');
    span.innerHTML = esc(n.nodeValue).replace(FRAC_RE, (m, pre, a, b) => `${pre}<span class="fr" role="math" aria-label="${b}분의 ${a}"><span class="fn">${a}</span><span class="fd">${b}</span></span>`);
    n.replaceWith(...span.childNodes);
  });
}

function sfxOn() { try { return localStorage.getItem('dnakids_sfx') !== '0'; } catch (e) { return true; } }
let actx = null;
function sfx(kind) {

      g.gain.exponentialRampToValueAtTime(0.0001, t0 + at + dur);

    else if (kind === 'wrong') { tone(392, 0, 0.18, 'sine', 0.16); tone(330, 0.15, 0.3, 'sine', 0.14); }
    else if (kind === 'flip') {
      // 종이 넘기는 소리: 짧은 잡음을 대역 필터로 쓸어 내려 "사락" 느낌을 낸다

      for (let i = 0; i < d.length; i++) d[i] = (Math.random() * 2 - 1) * (0.6 + 0.4 * Math.random());

      bp.frequency.setValueAtTime(2600, t0); bp.frequency.exponentialRampToValueAtTime(900, t0 + len);

      const g = actx.createGain();
      g.gain.setValueAtTime(0.0001, t0); g.gain.exponentialRampToValueAtTime(0.12, t0 + 0.05);
      g.gain.exponentialRampToValueAtTime(0.04, t0 + 0.16); g.gain.exponentialRampToValueAtTime(0.0001, t0 + len);

}

let typingOverlay = false;
const tf = () => document.getElementById('typingFrame');
const fsEl = () => document.fullscreenElement || document.webkitFullscreenElement;
function tellTyping(on) { const f = tf(); if (f && f.contentWindow) f.contentWindow.postMessage({ dnakids: 'setfs', on }, location.origin); }
async function typingFs(on) {
  const f = tf(); if (!f) return;
  if (on) {
    try {
      if (f.requestFullscreen) await f.requestFullscreen();
      else if (f.webkitRequestFullscreen) f.webkitRequestFullscreen();
      else throw new Error('no');
    } catch (e) { typingOverlay = true; f.classList.add('fs'); document.body.classList.add('nofs-scroll'); }
    tellTyping(true); setTimeout(() => f.focus(), 100);
  } else {
    if (fsEl()) { try { await (document.exitFullscreen ? document.exitFullscreen() : document.webkitExitFullscreen()); } catch (e) {} }
    typingOverlay = false; f.classList.remove('fs'); document.body.classList.remove('nofs-scroll');
    tellTyping(false);
  }
}
const onFsChange = () => { const f = tf(); if (!f) return; if (!fsEl() && !typingOverlay) tellTyping(false); else if (fsEl() === f) tellTyping(true); };
document.addEventListener('fullscreenchange', onFsChange);
document.addEventListener('webkitfullscreenchange', onFsChange);
window.addEventListener('message', e => {
  if (e.origin === location.origin && e.data && e.data.dnakids === 'fsctl') { typingFs(!!e.data.on); return; }
  if (e.origin !== location.origin || !e.data || e.data.dnakids !== 'typing') return;
  const r = e.data.record || {};
  const lang = r.lang === 'en' ? '영어' : '한글';
  const title = r.mode === 'practice' ? `${lang} 타자 연습` : `${lang} 타자 게임`;
  logOnce({ kind: 'typing', ref: r.mode === 'practice' ? 'practice' : (r.game || 'game'), title, score: r.mode === 'practice' ? r.kpm : r.score, total: r.mode === 'practice' ? r.acc : null, detail: r });
});

async function route() {
  stopNarr(); clearTimeout(window._nt);
  logView('/' + (location.hash.replace(/^#\/?/, '') || ''));
  const h = decodeURIComponent(location.hash.replace(/^#\/?/, ''));
  const [p, arg] = h.split('/');
  document.title = 'DNA Kids Lab · 학교 개념을 집에서 쉽게';
  const navKey = p === 'u' ? '' : p === 'a' ? 'activities' : (p || '');
  document.querySelectorAll('nav a').forEach(x => x.classList.toggle('on', x.dataset.nav === navKey));
  await endTracking();
  if (bookKeys) { document.removeEventListener('keydown', bookKeys); bookKeys = null; }
  document.body.classList.remove('nofs-scroll');
  renderAcct();
  try {
    if (p === 'u' && arg) await viewLesson(arg);
    else if (p === 'a' && arg) await viewActivity(arg);
    else if (p === 'activities') await viewActivities();
    else if (p === 'downloads') await viewDownloads();
    else if (p === 'typing') viewTyping();
    else if (p === 'login') viewLogin();
    else if (p === 'signup') viewSignup();
    else if (p === 'parent') await viewParent();
    else await viewHome();
    window.scrollTo(0, 0);
  } catch (e) {
    app.innerHTML = `<p class="empty">${esc(e.message)} <button class="f" onclick="location.reload()">다시 열기</button></p>`;
  }
}
